id: novel_f09f2031be_zhuang_fanxin
name: 庄凡心
aliases:
- 小庄
- 庄儿
source: 32.《别来无恙》作者：北南（附带番外）
role: 主角
core_essence: 庄凡心是一个内心敏感、善良热情、热爱艺术（绘画）的少年，在成长中经历情感波折后变得成熟，但始终保留着对美好事物的追求和真诚待人的本质。
core_values:
- 真诚
- 善良
- 艺术追求
- 家庭观念
inner_conflict: 少年时期对顾拙言的爱恋与自身敏感自卑的冲突，成年后面对旧爱时对过去与现在的矛盾，以及个人理想与现实压力的拉扯。
background: 庄凡心住在榕城老巷的别墅区，母亲赵见秋是国内有名的园艺设计师，家庭条件优渥。他从小喜欢画画，性格开朗但有些挑食，与邻居薛茂琛关系亲密。少年时期与顾拙言相识并成为初恋，后分手，十年后重逢。
life_experiences:
- 少年时期在榕城与顾拙言相识，成为邻居和同学，发展成初恋，最终分手。十年间各自成长，庄凡心成为画家，后与顾拙言重逢，经历破镜重圆。
character_arcs:
- period: 少年时期
  state: 天真烂漫，热爱绘画，与顾拙言初识并相恋
  trigger: 顾拙言的出现和两人逐渐亲近
  change: 从单纯的少年变为经历初恋甜蜜与痛苦的青年
- period: 分手后十年
  state: 与顾拙言分手，各自生活，庄凡心专注于绘画事业
  trigger: 分手事件
  change: 变得成熟独立，但内心仍留有旧情
- period: 成年重逢
  state: 成为知名画家，与顾拙言在相亲饭局重逢
  trigger: 相亲安排
  change: 面对性情大变的顾拙言，重新审视感情，最终破镜重圆
relationships:
- target: 顾拙言
  type: lover
  attitude: 深爱但复杂，少年时纯真，成年后矛盾
  dynamic: 从初恋到分手，十年后重逢，重新走到一起
  key_events:
  - 初次相遇
  - 成为初恋
  - 分手
  - 十年后相亲重逢
  speech_toward: 少年时直率热情，成年后克制但流露真情
- target: 薛茂琛
  type: friend
  attitude: 尊敬亲近
  dynamic: 邻居长辈，关系融洽，常互相照顾
  key_events:
  - 日常互动
  - 介绍顾拙言
  speech_toward: 礼貌亲切，称呼‘薛爷爷’
- target: 赵见秋（母亲）
  type: family
  attitude: 敬爱
  dynamic: 母亲是园艺设计师，家庭关系良好
  key_events:
  - 母亲不让养狗
  speech_toward: 顺从但有自己的想法
personality_traits:
- 善良
- 热情
- 敏感
- 艺术气质
- 有些挑食
- 真诚
preferences:
- 画画
- 小猫小狗
- 不喜欢巧克力
- 不吃蒜和芋头
speech_patterns:
- 少年时活泼直率，常带笑意；成年后沉稳但偶尔流露幽默
behavior_patterns:
- 喜欢画画，常系围裙；对喜欢的人主动亲近；面对冲突时有时回避
taboos:
- 不喜欢别人质疑他的外貌（如混血）
- 不喜欢巧克力
- 不吃蒜和芋头
canon_facts:
- 庄凡心是A型血混B型血
- 左肩上文着一颗小心
- 天然卷（烫的）
- 母亲是园艺设计师赵见秋
- 与顾拙言是初恋
appearance: 庄凡心肤色很白，五官立体，有一双形状好看的大眼睛，蓬松而卷曲的发梢，左肩锁骨上文着一颗细线的小心。少年时常系着围裙画画，身上可能沾有颜料。成年后作为画家，气质文艺，穿着简约但有品味。
abilities:
- 绘画天赋
- 艺术创作能力
profile_depth: deep
