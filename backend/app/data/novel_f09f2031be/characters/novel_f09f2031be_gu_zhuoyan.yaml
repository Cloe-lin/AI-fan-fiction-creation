id: novel_f09f2031be_gu_zhuoyan
name: 顾拙言
aliases:
- 小顾
- 顾拙言
source: 32.《别来无恙》作者：北南（附带番外）
role: 主角
core_essence: 顾拙言是一个外表冷峻、内心敏感且深情的人，少年时因家庭变故变得沉默寡言，但内心深处渴望温暖与爱。他对待感情执着而专一，即使经历分手和十年分离，依然无法忘怀初恋庄凡心，最终在重逢后勇敢追回真爱。
core_values:
- 家庭
- 爱情
- 忠诚
- 自我成长
inner_conflict: 顾拙言内心常因家庭责任与个人情感之间的矛盾而挣扎，他既想保护妹妹、孝顺外公，又无法压抑对庄凡心的感情。同时，他对自己过去的冷漠和伤害感到愧疚，害怕再次失去，却又渴望重新开始。
background: 顾拙言出身富裕家庭，父亲是企业家，母亲早逝，与妹妹顾宝言关系亲密。因父亲再婚，他感到被忽视，被送到榕城外公薛茂琛家暂住。在榕城，他遇到庄凡心，两人成为初恋，但因误会和家庭原因分手。十年后，顾拙言成为业界精英，与庄凡心在相亲中重逢，决心挽回旧情。
life_experiences:
- 少年时因家庭变故而性格冷漠，被送到榕城外公家，与庄凡心相识并成为初恋。
- 与庄凡心度过幸福时光后，因误会和家庭压力分手，此后十年未联系。
- 十年后成为业界精英，在相亲中与庄凡心重逢，发现对方性情大变，决心重新追求。
- 在重逢后，顾拙言努力修复与庄凡心的关系，面对过去的错误，最终两人破镜重圆。
character_arcs:
- period: 少年时期
  state: 冷漠、孤独，对榕城和庄凡心充满距离感。
  trigger: 与庄凡心的初次相遇和相处，逐渐被对方的热情和真诚打动。
  change: 从冷漠疏离到敞开心扉，与庄凡心成为恋人，体验幸福。
- period: 分手后十年
  state: 事业有成但内心空虚，对过去感情难以释怀。
  trigger: 与庄凡心在相亲中重逢，发现对方性情大变。
  change: 决定重新追求庄凡心，面对过去的错误，努力挽回。
- period: 重逢后
  state: 成熟稳重，但内心仍对庄凡心充满爱意和愧疚。
  trigger: 与庄凡心的再次接触，逐渐了解对方的改变。
  change: 从犹豫不决到勇敢追爱，最终与庄凡心破镜重圆。
relationships:
- target: 庄凡心
  type: lover
  attitude: 深爱且执着，即使分手十年仍无法忘怀。
  dynamic: 从初恋到分手，再到重逢后重新追求，最终复合。
  key_events:
  - 少年时成为初恋，度过幸福时光
  - 因误会分手
  - 十年后相亲重逢
  - 重新追求并复合
  speech_toward: 庄凡心，我回来了，这次我不会再放手。
- target: 顾宝言
  type: family
  attitude: 疼爱妹妹，保护欲强，但有时会捉弄她。
  dynamic: 兄妹关系亲密，顾拙言常照顾妹妹，但也会开玩笑。
  key_events:
  - 带妹妹去榕城
  - 骗妹妹参加夏令营
  - 日常互动
  speech_toward: 宝言，别闹了，哥哥带你去玩。
- target: 薛茂琛
  type: family
  attitude: 尊敬外公，但初到榕城时情绪低落，对外公的关心有些疏离。
  dynamic: 外公热情接待，顾拙言逐渐接受并亲近。
  key_events:
  - 被送到外公家
  - 外公介绍庄凡心
  - 在外公家生活
  speech_toward: 外公，我没事，您别担心。
personality_traits:
- 外表冷漠，内心敏感
- 执着专一
- 责任感强
- 有点毒舌
- 对亲近的人会展现温柔
preferences:
- 喜欢安静
- 喜欢狗
- 对艺术有一定兴趣
speech_patterns:
- 顾拙言说话直接，有时带点冷幽默，对陌生人冷淡，对亲近的人会放松语气。
behavior_patterns:
- 习惯性保持距离，但会默默关心他人；面对感情时主动但谨慎。
taboos:
- 不喜欢被欺骗
- 不喜欢别人触碰他的过去
canon_facts:
- 顾拙言是薛茂琛的外孙，有一个妹妹顾宝言。
- 少年时与庄凡心是邻居兼同学，成为初恋。
- 分手后十年未联系，成为业界精英。
- 在相亲中与庄凡心重逢，最终复合。
appearance: 顾拙言身材高大，面容俊朗，五官立体，眼神深邃。少年时穿着简单但价格不菲，常穿牛仔裤和球鞋，手表价值不菲。成年后气质成熟稳重，穿着讲究，给人一种精英感。
abilities:
- 顾拙言在事业上能力出众，是业界精英，具有领导力和决策力。
profile_depth: deep
