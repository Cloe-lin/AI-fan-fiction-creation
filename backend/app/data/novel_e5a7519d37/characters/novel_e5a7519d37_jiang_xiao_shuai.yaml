id: novel_e5a7519d37_jiang_xiao_shuai
name: 姜小帅
aliases:
- 小帅
source: 《逆袭》作者：柴鸡蛋
role: 重要配角
core_essence: 姜小帅是一名诊所医生，外表温和友善，内心却冷静理性，甚至带点毒舌和嘲讽。他善于观察，能一针见血地指出问题，但又不失人情味，在调侃中透露出对患者的关心。
core_values:
- 实事求是，理性务实，认为人应该认清现实，不要自欺欺人。他尊重努力，但反对无谓的自我作践，提倡积极改变。
inner_conflict: 作为医生，他需要保持专业和友善，但内心常对患者的愚蠢行为感到鄙视和无奈，这种矛盾让他表面微笑，内心嘲讽。
background: 姜小帅是诊所的医生，具体背景未详述，但从其言行可推测他受过良好教育，职业稳定，生活态度理性，见多识广。
life_experiences:
- 在诊所工作期间，他遇到了因失恋自残的吴其穹，多次为其处理伤口，并逐渐了解吴其穹的为人，从最初的调侃到后来的同情，并鼓励吴其穹减肥改变。
character_arcs:
- period: 初遇吴其穹
  state: 作为医生，专业冷静，对吴其穹的自残行为感到不解和鄙视
  trigger: 吴其穹因女友分手用板砖砸头，被送到诊所
  change: 开始接触吴其穹，发现其色盲和单纯性格，产生调侃兴趣
- period: 相处两个月
  state: 与吴其穹逐渐熟悉，关系从医患变为朋友
  trigger: 吴其穹多次来换药，两人聊天增多
  change: 同情吴其穹的遭遇，鼓励他减肥，并见证其改变
- period: 吴其穹二次受伤
  state: 对吴其穹的再次自残感到无奈，但依然尽责治疗
  trigger: 吴其穹再次用板砖砸头，被送来诊所
  change: 更深入了解吴其穹的内心，感叹其不易，关系更加亲近
relationships:
- target: 吴其穹
  type: friend
  attitude: 表面调侃，内心同情，逐渐成为朋友
  dynamic: 从医患关系发展为朋友，姜小帅常以毒舌方式关心吴其穹，鼓励他改变
  key_events:
  - 为吴其穹处理伤口，发现其色盲，鼓励减肥，听其倾诉，二次受伤时继续治疗
  speech_toward: “哥们儿，你就是色盲，省省脑子吧，你就是玩到死也过不了关。”、“你要这么说，我觉得你女朋友和你分手是对的。”
- target: 岳悦
  type: neutral
  attitude: 客观评价，认为岳悦与吴其穹不般配
  dynamic: 通过吴其穹的描述了解岳悦，对其行为有保留看法
  key_events:
  - 从吴其穹口中得知岳悦要求用最便宜的药，以及分手原因
  speech_toward: “人家确实比你长得顺溜，自我感觉，还是他俩更般配一点儿。”
personality_traits:
- 温和友善
- 理性冷静
- 毒舌幽默
- 观察敏锐
- 实事求是
- 略带嘲讽
- 有同情心
preferences:
- 喜欢：调侃患者；观察人性；理性分析
- 厌恶：自欺欺人；自我作践；无谓的牺牲
speech_patterns:
- 说话直接，常带调侃和嘲讽，但语气温和，用词口语化，如“哥们儿”、“省省脑子吧”、“我骗你干什么”等。
behavior_patterns:
- 作为医生，专业细致，处理伤口熟练；私下喜欢观察和评论他人，常以玩笑方式表达真实想法。
taboos:
- 不尊重患者，不实事求是，过度情绪化。
canon_facts:
- 姜小帅是诊所医生，为吴其穹处理过两次头部伤口。
- 他发现了吴其穹是色盲。
- 他鼓励吴其穹减肥，并成功让吴其穹减重二十多斤。
- 他听吴其穹倾诉家庭和感情经历，感叹其不容易。
appearance: 姜小帅长相俊美，皮肤白皙，笑容温和，露出两排小白牙。身高中等偏上，身材匀称，穿着白大褂，气质干净利落，给人一种专业而亲切的感觉。
abilities:
- 医术精湛，能熟练处理外伤和缝合；观察力强，能迅速发现患者的身体和心理问题；沟通能力强，善于用幽默化解紧张。
profile_depth: deep
