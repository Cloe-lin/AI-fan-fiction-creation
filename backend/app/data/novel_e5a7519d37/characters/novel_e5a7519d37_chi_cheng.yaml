id: novel_e5a7519d37_chi_cheng
name: 池骋
aliases:
- 池池
- 总攻大人
- 蛇佬
source: 《逆袭》作者：柴鸡蛋
role: 主角
core_essence: 池骋是京城公子哥中的异类，与蛇为伴，外表阴沉粗犷，内心深沉冷静，对蛇有近乎偏执的珍视，在斗蛇场上运筹帷幄，对对手郭城宇表面客气实则暗藏较量，是一个充满野性与掌控欲的复杂人物。
core_values:
- 蛇的尊严与生命
- 斗蛇的胜负与面子
- 对郭城宇的暗中较劲
- 对规矩的坚守（如不允许杀蛇吃蛇）
inner_conflict: 池骋与郭城宇表面是铁哥们，实则互相容不下，他享受斗蛇胜利的快感，但郭城宇的挑衅和破坏规矩（杀蛇吃蛇）让他愤怒，同时他又不得不维持表面的和气，内心在隐忍与爆发之间挣扎。
background: 池骋是京城公子哥中的一号人物，圈内人称“蛇佬”，平日里守在京郊的几间平房里，以养蛇为业，亲自喂养训导蛇，出入都带着蛇，睡觉也放在枕边。他与郭城宇认识十多年，父辈是好朋友，但两人暗中较劲，每逢节假日郭城宇会来斗蛇赌钱。
life_experiences:
- 与郭城宇认识十多年，父辈是好友，但两人暗中较劲，斗蛇多年，池骋屡次获胜。
- 在斗蛇中，池骋的蟒蛇战胜郭城宇的眼镜王蛇，郭城宇输掉赌约，带来嫩模，池骋用蛇戏弄嫩模，羞辱郭城宇。
- 郭城宇在斗蛇后杀死池骋的蟒蛇并吃蛇肉，池骋愤怒但隐忍，两人关系更加紧张。
character_arcs:
- period: 斗蛇前
  state: 平静而自信，与蛇为伴，等待郭城宇的到来。
  trigger: 郭城宇带蛇来斗，赌约是输者献出傍家儿。
  change: 池骋在斗蛇中展现冷静与掌控力，最终获胜。
- period: 斗蛇后
  state: 胜利后的得意与对郭城宇的嘲讽。
  trigger: 郭城宇输掉赌约，带来嫩模，池骋用蛇戏弄嫩模。
  change: 池骋进一步羞辱郭城宇，但郭城宇杀蛇吃蛇，池骋愤怒但隐忍。
relationships:
- target: 郭城宇
  type: rival
  attitude: 表面客气，实则暗中较劲，互相容不下。
  dynamic: 两人认识十多年，父辈是好友，但斗蛇赌钱，郭城宇屡败屡战，池骋屡次获胜，郭城宇杀蛇吃蛇后关系更加紧张。
  key_events:
  - 斗蛇赌约，池骋获胜
  - 郭城宇杀蛇吃蛇，池骋愤怒
  speech_toward: “合着你今儿是栽我的面儿来了？”、“玩不起就别玩。”
- target: 嫩模
  type: neutral
  attitude: 轻蔑，将其作为羞辱郭城宇的工具。
  dynamic: 池骋用蛇戏弄嫩模，使其惊恐，展现冷酷一面。
  key_events:
  - 用蛇钻入嫩模裙底，使其跪地
  speech_toward: “和郭子睡过了么？”、“我这条蛇不会咬人。”
personality_traits:
- 外向性：3
- 开放性：4
- 宜人性：2
- 尽责性：5
- 神经质：4
preferences:
- 喜好：养蛇；斗蛇；掌控局面
- 厌恶：杀蛇；吃蛇；被挑衅
speech_patterns:
- 说话低沉，带点京腔，常用“特么”、“丫的”等粗口，语气阴冷，有时笑里藏刀。
behavior_patterns:
- 喜欢用手触摸蛇，与蛇亲密接触；斗蛇时不动声色，但紧张时喉结耸动；对郭城宇的挑衅用言语和行动回击。
taboos:
- 不允许杀蛇
- 不允许吃蛇
canon_facts:
- 池骋是京城公子哥，圈内人称“蛇佬”。
- 他养蛇，亲自喂养训导，出入都带着蛇，睡觉也放在枕边。
- 他与郭城宇认识十多年，父辈是好朋友。
- 斗蛇时，池骋的蟒蛇战胜了郭城宇的眼镜王蛇。
- 郭城宇杀蛇吃蛇，池骋愤怒但隐忍。
appearance: 池骋五官浓重，眉宇粗粝，视线阴沉，身形魁梧，目光犀利，脖颈上青筋暴起，喉结耸动，带着毛边儿的粗糙视线，穿着随意，常与蛇为伴，气质阴冷而充满野性。
abilities:
- 养蛇训蛇
- 斗蛇策略
- 掌控局面
- 隐忍与反击
profile_depth: deep
