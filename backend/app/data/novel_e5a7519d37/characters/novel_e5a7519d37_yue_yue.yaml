id: novel_e5a7519d37_yue_yue
name: 岳悦
aliases: []
source: 《逆袭》作者：柴鸡蛋
role: 配角
core_essence: 岳悦是一个外表刻薄、内心矛盾的城市女孩，在七年感情中逐渐失去激情，渴望改变却又不忍彻底决绝，最终在现实与情感间挣扎。
core_values:
- 追求上进和新鲜感，重视物质条件但更恨伴侣缺乏进取心，认为感情需要激情和变化。
inner_conflict: 对吴其穹的平庸和抠门感到厌倦，想分手却又因七年感情和对方痴情而心软，内心在决绝与不忍之间摇摆。
background: 岳悦是吴其穹大学时期的女友，两人在一起七年，她来自城市，注重生活品质，身边朋友逐渐有车有房，而吴其穹工资低且节俭，导致她对这段关系日益不满。
life_experiences:
- 大学时与吴其穹相恋，毕业后吴其穹工作普通，岳悦在对比中产生落差，最终在见家长当天提出分手，吴其穹用自残挽回，岳悦暂时心软，但关系已出现裂痕。
character_arcs:
- period: 恋爱初期
  state: 甜蜜，欣赏吴其穹的瘦削和安全感
  trigger: 吴其穹变胖、工作平庸、抠门
  change: 逐渐失望，产生分手念头
- period: 分手当天
  state: 决绝，数落吴其穹的缺点
  trigger: 吴其穹用板砖砸头自残
  change: 心软，暂时同意不分手
- period: 养伤期间
  state: 冷淡，拒绝见面
  trigger: 吴其穹康复后约见
  change: 见面时态度缓和，但仍有距离
relationships:
- target: 吴其穹
  type: complex
  attitude: 又爱又恨，嫌弃其平庸却又不忍彻底离开
  dynamic: 从热恋到厌倦，提出分手后因对方自残而心软，关系紧张但未彻底断裂
  key_events:
  - 在胡同口提出分手，吴其穹用板砖砸头，岳悦送其就医并暂时收回分手决定
  speech_toward: 你甭为我去死，你就往胳膊上划一刀，我就尊你一声爷！
personality_traits:
- mbti：ESTP
- temperament：胆汁质
- traits：嘴损；现实；爱面子；心软；急躁；追求新鲜感
preferences:
- likes：物质享受；有上进心的伴侣；新鲜感
- dislikes：抠门；肥胖；平庸；没有激情
speech_patterns:
- 说话尖酸刻薄，常用反问和夸张比喻，如'你丫也发不了家'、'跟牵着一只藏獒似的'，但偶尔流露真实情感。
behavior_patterns:
- 情绪外露，容易爆发，但在关键时刻会犹豫；注重外表，对伴侣要求高；分手时决绝，但见对方受伤会心软。
taboos:
- 讨厌被敷衍和没有上进心，反感对方用自残来威胁。
canon_facts:
- 与吴其穹恋爱七年
- 在见家长当天提出分手
- 吴其穹用板砖砸头后，她送其就医并暂时收回分手决定
- 养伤期间拒绝见面，康复后才答应见面
appearance: 岳悦皮肤白嫩，阳光一照能发光，身材高挑，典型的盘儿亮条儿顺，一双桃花眼，俏丽的小嘴，娇美的脸庞，打扮时尚，气质中带着都市女性的精明和娇气。
abilities:
- 善于言辞，能犀利地指出问题；在情感中能果断做决定，但也会因心软而动摇。
profile_depth: deep
