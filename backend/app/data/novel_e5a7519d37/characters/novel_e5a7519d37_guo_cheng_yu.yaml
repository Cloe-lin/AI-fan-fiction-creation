id: novel_e5a7519d37_guo_cheng_yu
name: 郭城宇
aliases:
- 郭子
source: 《逆袭》作者：柴鸡蛋
role: 重要配角
core_essence: 郭城宇是一个外表邪气、内心争强好胜的京城公子哥，喜欢玩蛇却从不亲自饲养，与池骋表面称兄道弟实则暗中较劲，屡败屡战，性格中带有痞气和不服输的韧劲。
core_values:
- 面子
- 输赢
- 兄弟情义（表面）
- 玩乐的刺激
inner_conflict: 郭城宇内心渴望在与池骋的较量中获胜，但屡次失败，同时又要维持表面上的兄弟情谊，这种矛盾让他既不甘又无奈。
background: 郭城宇是京城公子哥，与池骋认识十多年，父辈是好朋友，两人在外人眼里关系铁，但实际上谁也容不下谁。他喜欢玩蛇，但自己不养，常买蛇找人代养，闲时带出去溜达，节假日去池骋处斗蛇赌钱。
life_experiences:
- 与池骋斗蛇多年，屡战屡败，但从不缺席。
- 在斗蛇中输掉后，按约定将新勾搭的嫩模送给池骋，却因池骋用蛇伤人而吃瘪。
character_arcs:
- period: 斗蛇前
  state: 自信满满，带着爱蛇和嫩模前往池骋处
  trigger: 斗蛇开始
  change: 从自信转为紧张，最终失败
- period: 斗蛇失败后
  state: 输掉赌约，被迫交出嫩模
  trigger: 池骋用蛇伤嫩模
  change: 从强装镇定转为愤怒和恶心，但硬咽下这口气
relationships:
- target: 池骋
  type: rival
  attitude: 表面称兄道弟，内心较劲，不服输
  dynamic: 两人认识十多年，父辈是好友，但暗中互相较劲，斗蛇赌钱，郭城宇屡败屡战
  key_events:
  - 斗蛇输给池骋，被迫将嫩模送给他，被池骋用蛇伤嫩模羞辱
  speech_toward: “得，今儿又输了。”、“可不么！我谁也不惦记，就惦记你。”
- target: 李旺
  type: friend
  attitude: 信任但有时迁怒
  dynamic: 李旺是郭城宇的跟班，帮他办事，提醒他时间，在嫩模事件中提醒郭城宇是池骋故意黑他
  key_events:
  - 李旺提醒郭城宇出发，在嫩模事件中告知真相
  speech_toward: “你他妈怎么找的人？”
- target: 嫩模
  type: complex
  attitude: 当作赌注，不尊重
  dynamic: 郭城宇将新勾搭的嫩模作为赌注送给池骋，在嫩模被池骋用蛇伤时，他虽愤怒但未阻止
  key_events:
  - 将嫩模送给池骋，嫩模被池骋用蛇伤
  speech_toward: “这是池骋，比你大，叫池哥。”
personality_traits:
- 爱笑
- 争强好胜
- 痞气
- 不服输
- 表面豁达实则计较
- 喜欢玩蛇但怕麻烦
preferences:
- 喜欢玩蛇
- 喜欢赌钱
- 喜欢勾搭嫩模
speech_patterns:
- 说话带脏字，语气痞气，常用“他妈”、“丫”等词，如“真他妈是个骚包”、“干死丫的”。
behavior_patterns:
- 喜欢用玩蛇和斗蛇来彰显自己的身份和刺激感，输赢都强装镇定，但内心较劲。
taboos:
- 被池骋羞辱，输掉赌约后被迫交出嫩模，被池骋用蛇伤嫩模。
canon_facts:
- 郭城宇喜欢玩蛇，但自己不养，买蛇找人代养。
- 他与池骋认识十多年，父辈是好朋友。
- 他斗蛇屡战屡败，但从不缺席。
- 他输掉赌约后，将嫩模送给池骋。
appearance: 郭城宇寸头窄脸，胡茬青密，一双吊梢眼，白眼球上隐约可见红色纹路，瞧着总跟没睡好似的，其实天生就这样。唇线硬朗，下巴略尖，乍一看有种不好相处的感觉，实际上这人特爱笑。五官清秀，幽幽邪邪的，让人捉摸不透。
abilities:
- 擅长玩蛇，能识别好蛇，斗蛇经验丰富，但屡败于池骋。
profile_depth: deep
