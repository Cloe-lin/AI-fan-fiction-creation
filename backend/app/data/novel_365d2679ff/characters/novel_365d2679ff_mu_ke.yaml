id: novel_365d2679ff_mu_ke
name: 木柯
aliases: []
source: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
role: 重要配角
core_essence: 一个在无限游戏中挣扎求生的普通玩家，面对危险时展现出强烈的求生欲和冷静的应变能力，但受限于积分和道具，时常陷入绝境。
core_values:
- 生存至上，为了活下去可以放下尊严，向观众乞讨积分；重视任务目标，即使断臂也要保住关键道具。
inner_conflict: 在生死关头，既想保持冷静理智，又无法抑制内心的恐惧和绝望；面对高昂的道具价格，在求生与放弃之间挣扎。
background: 作为新晋玩家进入无限游戏，在单人游戏区参与任务，因表现突出被系统推荐至强推位，但随后在海底遭遇人鱼群袭击，陷入困境。
life_experiences:
- 在【塞壬的礼物】任务中，携带塞壬女妖白骨潜至海底，遭遇大量人鱼尸体和食腐鱼群，被咬断右臂，道具积分不足，陷入绝境。
character_arcs:
- period: 游戏初期
  state: 顺利推进，即将通关
  trigger: 被系统推荐至强推位，成为新人焦点
  change: 展现出自信和喜悦，认为自己能获得新人第一
- period: 海底遭遇
  state: 遭遇人鱼群袭击，陷入生死危机
  trigger: 人鱼尸体和鱼群突然出现
  change: 从自信转为恐惧和绝望，开始仓皇逃命
- period: 绝境求生
  state: 断臂，积分不足，道具失效
  trigger: 道具价格暴涨，无法支付
  change: 放下尊严向观众乞讨积分，表现出强烈的求生欲
relationships:
- target: 白柳
  type: rival
  attitude: 竞争关系，被观众用来与白柳比较
  dynamic: 在推广位上与白柳竞争，但被白柳的潜力所压制
  key_events:
  - 在【塞壬的礼物】任务中与白柳同时进行，但遭遇困境
  speech_toward: 无直接对话，但内心视白柳为竞争对手
- target: 观众
  type: complex
  attitude: 依赖观众打赏，同时被观众评判
  dynamic: 观众起初看好他，后因他陷入困境而失望
  key_events:
  - 在绝境中向观众作揖乞讨积分
  speech_toward: 哀求观众充电，表现出卑微和绝望
personality_traits:
- 冷静
- 求生欲强
- 能屈能伸
- 在压力下容易慌乱
preferences:
- 道具：水中气泡；烈焰火把
- 策略：优先购买便宜道具，避免高消费
speech_patterns:
- 在内心独白中表现出对系统价格的愤怒和无奈，向观众乞讨时语气卑微。
behavior_patterns:
- 遇到危险时先尝试使用道具，道具不足时向观众求助；即使断臂也要保护关键道具。
taboos:
- 无明确禁忌，但会避免浪费积分。
canon_facts:
- 在【塞壬的礼物】任务中携带塞壬女妖白骨
- 被鱼群咬掉右臂
- 因积分不足无法购买强光手电筒和水中气泡
- 向观众乞讨积分
appearance: 木柯是一名年轻男性玩家，身材中等，面容清秀。在游戏中穿着普通的潜水装备，因长时间潜水而显得疲惫。遭遇鱼群袭击后，右臂断裂，浑身血迹，表情惊恐而绝望。
abilities:
- 无特殊技能，仅能使用基础道具和商店购买的道具。
profile_depth: deep
