id: novel_365d2679ff_bai_liu
name: 白柳
aliases:
- 白六
source: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
role: 主角
core_essence: 一个被金钱欲望驱使的失业社畜，在无限恐怖游戏中以高智商和冷静疯狂的行事风格，逐渐成为游戏中的神明般存在。
core_values:
- 金钱至上，为了钱可以不要命；追求高风险高回报的合法途径；在游戏中追求积分兑换金钱，同时享受游戏带来的刺激与掌控感。
inner_conflict: 对金钱的极度渴望与道德底线之间的拉扯；在游戏中逐渐发现自己非人的本质，与人类身份认同的冲突。
background: 白柳原本是一个普通社畜，因失业后爆发强烈的金钱欲望，被卷入无限游戏。他从小爱钱到不正常，被诊断为金钱囤积症，曾多次把心理医生说哭。失业后陷入焦虑，渴望高风险赚钱方式，最终在梦中被游戏选中。
life_experiences:
- 失业后陷入金钱焦虑，被卷入无限游戏；在《塞壬小镇》副本中作为新人玩家，展现出超常的冷静和智力；游戏过程中逐渐揭开自身与游戏神明的联系。
character_arcs:
- period: 失业前
  state: 普通社畜，有固定收入，勉强克制金钱欲望
  trigger: 失业
  change: 陷入无法自控的金钱渴望，触发游戏开启
- period: 游戏初期
  state: 新人玩家，F级评价，但智力与精神值异常
  trigger: 进入《塞壬小镇》副本
  change: 展现出超常冷静与智力，开始适应游戏规则
- period: 游戏后期
  state: 逐渐成为游戏中的神明存在
  trigger: 游戏进程深入，身份揭露
  change: 从追求金钱的玩家，转变为游戏本身的神明
relationships:
- target: 塔维尔（谢塔）
  type: complex
  attitude: 复杂，既有利用也有情感纠葛
  dynamic: 从背景板到后期重要角色，与白柳有深厚联系
  key_events:
  - 在游戏中相遇，逐渐揭示与白柳的宿命关联
  speech_toward: （未明确，但后期互动增多）
- target: 心理医生
  type: neutral
  attitude: 讽刺与无奈
  dynamic: 多次把心理医生说哭，但心理医生仍试图帮助他
  key_events:
  - 诊断白柳为金钱囤积症，建议他调节心态
  speech_toward: “你他妈这不是挺知道会发生什么吗？”
- target: 朋友
  type: friend
  attitude: 调侃与劝诫
  dynamic: 朋友试图用《刑法》劝他放弃高风险赚钱想法
  key_events:
  - 朋友建议他看《刑法》找赚钱方法
  speech_toward: “你随便翻开一页找一条，上面就是高风险的赚钱工作。”
personality_traits:
- 爱钱如命
- 冷静理性
- 有点疯
- 毒舌
- 高智商
- 不择手段
- 享受掌控
preferences:
- likes：金钱；高风险高回报；掌控局面
- dislikes：贫穷；失去控制；无意义的牺牲
speech_patterns:
- 语言简洁直接，常带讽刺，对金钱相关话题异常执着，有时会爆粗口。
behavior_patterns:
- 在游戏中冷静分析，善于利用规则，为了钱可以冒险，面对恐怖场景不露惧色。
taboos:
- 不犯法（但游戏内可能例外），不无谓牺牲，不放弃赚钱机会。
canon_facts:
- 被诊断为金钱囤积症
- 失业后触发游戏
- 智力值89，幸运值0，精神值100
- 玩家等级F（？）
- 在《塞壬小镇》副本中作为新人玩家
appearance: 白柳面容清隽白皙，身材修长，常穿普通便装，气质冷静疏离，眼神中透露出对金钱的渴望和游戏的掌控感。
abilities:
- 高智力（89），精神值极高（100），幸运值极低（0），初始无技能，但后期可能觉醒与神明相关的力量。
profile_depth: deep
