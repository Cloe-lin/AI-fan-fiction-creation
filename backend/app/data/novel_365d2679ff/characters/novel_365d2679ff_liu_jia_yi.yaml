id: novel_365d2679ff_liu_jia_yi
name: 刘佳仪
aliases:
- 佳佳
source: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
role: 重要配角
core_essence: 一个在福利院蘑菇中毒事件中唯一幸存下来的八岁盲女，看似脆弱实则敏锐聪慧，拥有超乎年龄的观察力和生存直觉，是潜在的游戏玩家，也是哥哥刘怀和陆驿站等人保护与争夺的对象。
core_values:
- 生存、信任、亲情
inner_conflict: 渴望依赖哥哥刘怀，但又因自身的特殊性和潜在的游戏命运而不得不独立；对周围环境充满警惕，但内心深处渴望被理解和保护。
background: 刘佳仪是刘怀同父异母的妹妹，八岁，天生失明，双眼灰白。因父亲无力抚养，被哥哥刘怀寄养在福利院。在福利院蘑菇中毒事件中，她因敏锐察觉老师的异常而偷偷倒掉有毒的饭食，成为唯一幸存者。事件后，她因惊吓和失明而拒绝与外界交流，只信任哥哥刘怀。
life_experiences:
- 在福利院生活，因失明而依赖听觉和触觉，对周围环境变化异常敏感。
- 在蘑菇中毒事件中，因察觉老师行为异常而倒掉饭菜，侥幸存活。
- 事件后住院，因创伤和失明拒绝与陌生人交流，只对哥哥刘怀开口。
- 被白柳和陆驿站关注，白柳认为她可能成为游戏玩家，试图与她合作。
character_arcs:
- period: 福利院事件前
  state: 在福利院中安静生活，依赖哥哥每周探望，对世界充满好奇但受限。
  trigger: 福利院蘑菇中毒事件
  change: 成为唯一幸存者，内心受到冲击，对外界更加警惕和封闭。
- period: 住院期间
  state: 蜷缩在病床上，拒绝交流，只对哥哥刘怀有反应。
  trigger: 白柳的到访和关于游戏的谈话
  change: 开始意识到自己可能被卷入游戏，但尚未完全理解，内心迷茫。
relationships:
- target: 刘怀
  type: family
  attitude: 依赖、信任、亲近
  dynamic: 刘怀是她的同父异母哥哥，也是她唯一的依靠。刘怀每周探望，保护她，她只对刘怀敞开心扉。
  key_events:
  - 在病房中，刘怀保护她免受白柳的打扰；她向刘怀坦白自己倒饭的真相。
  speech_toward: 哥哥，不是的。
- target: 白柳
  type: complex
  attitude: 警惕、好奇、未知
  dynamic: 白柳认为她是潜在玩家，试图与她合作，但刘怀强烈反对。刘佳仪对白柳的谈话内容被屏蔽，尚未形成明确态度。
  key_events:
  - 白柳到访病房，提出帮助她撑过第一场游戏，但被刘怀拒绝。
  speech_toward: 哥哥你们在说什么啊？我要进入什么？
- target: 陆驿站
  type: neutral
  attitude: 未知
  dynamic: 陆驿站是警察，负责案件，有意收养她，但刘佳仪尚未与他深入交流。
  key_events:
  - 陆驿站向白柳介绍她的情况。
  speech_toward: 无
personality_traits:
- 敏锐
- 谨慎
- 内向
- 坚韧
- 早熟
preferences:
- 喜欢：安静的环境、哥哥的陪伴
- 厌恶：陌生人、嘈杂的环境
speech_patterns:
- 说话细声细气，声音微弱但清晰，语句简短，常用“哥哥”称呼刘怀。
behavior_patterns:
- 喜欢蜷缩成一团，抱膝而坐，将脸埋起来；对陌生环境会颤抖，但会通过细微动作观察（如拉扯哥哥外套）。
taboos:
- 不能接受太多人的环境，否则会尖叫。
canon_facts:
- 八岁盲女，双眼灰白。
- 福利院蘑菇中毒事件唯一幸存者。
- 偷偷倒掉老师盛的饭而避免中毒。
- 被白柳认为是潜在游戏玩家。
- 只信任哥哥刘怀。
appearance: 刘佳仪是一个八岁的小女孩，身材瘦弱不堪，像一具没发育好的小骷髅架子，穿着宽大的病号服，空荡荡地挂在骨架上。她有一头毛躁躁的头发，双眼的眼珠是像雾霾蒙住般的灰白色，皮肤苍白，嘴唇发干。整体给人一种脆弱、需要保护的感觉。
abilities:
- 虽然失明，但拥有超乎常人的敏锐感知力，能通过细微变化察觉异常（如老师的行为），在危机中展现出生存智慧。
profile_depth: deep
