id: novel_365d2679ff_xie_ta
name: 谢塔
aliases:
- 塔维尔
- 黑桃
source: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
role: 重要配角
core_essence: 谢塔是一个被神性包裹的悲剧性怪物，他拥有近乎神明的力量与外貌，却因自身的特殊体质沦为被利用和折磨的对象。他沉默寡言，情感内敛，却对白柳怀有深沉而纯粹的爱与守护，甘愿为其背负罪名、承受痛苦，甚至牺牲生命。他的存在既是白柳记忆中的温柔港湾，也是其内心最深的创伤与执念。
core_values:
- 守护白柳
- 自我牺牲
- 沉默的忠诚
- 对信仰的执着
inner_conflict: 谢塔内心深藏着对白柳的爱与保护欲，但他作为‘怪物’的身份和被迫承受的折磨使他无法正常表达情感，甚至认为自己不配拥有温暖。他渴望靠近白柳，却又因自身的气味和伤痕而自卑退缩，在牺牲与自我保全之间反复挣扎。
background: 谢塔是福利院中一个被特殊对待的孩子，因体质特殊被用于‘受洗’和抽血仪式，供有钱人使用。他拥有近乎不死的怪物体质，但长期遭受肉体折磨，身上布满针眼和青紫。他与白柳在福利院相识，成为彼此唯一的精神依靠，后因替白柳顶罪而被折磨致死，其死亡成为白柳记忆中被刻意遗忘的创伤。
life_experiences:
- 在福利院中作为‘怪物’被隔离和利用，定期接受抽血仪式。
- 与白柳相识，成为其唯一的朋友和守护者，共同度过孤独的童年。
- 在白柳被惩罚时主动顶罪，承认是自己指使白柳，从而被更残酷地对待。
- 最终在福利院水塘中被折磨致死，尸体沉入水底，成为白柳恐惧水的根源。
character_arcs:
- period: 福利院时期
  state: 沉默、孤独、被折磨的怪物
  trigger: 与白柳的相遇
  change: 开始感受到温暖与情感，学会微笑，并产生守护白柳的意愿。
- period: 顶罪事件
  state: 虚弱但坚定
  trigger: 白柳被揭发
  change: 主动承担罪名，牺牲自己以保护白柳，最终导致死亡。
relationships:
- target: 白柳
  type: complex
  attitude: 深爱、守护、温柔
  dynamic: 谢塔是白柳童年唯一的温暖，他默默承受痛苦以换取白柳的安全，其死亡成为白柳心中无法愈合的伤口。
  key_events:
  - 送书给白柳
  - 在受洗池中与白柳共眠
  - 顶罪被折磨致死
  speech_toward: “不会的，我是怪物，所以我不会死。”
- target: 福利院院长及老师
  type: enemy
  attitude: 恐惧、憎恨、冷漠
  dynamic: 他们利用谢塔的体质进行抽血，视其为怪物，对其施加残酷的惩罚。
  key_events:
  - 强制抽血
  - 惩罚折磨
  speech_toward: （无直接对话，但通过行为表现出反抗与沉默）
personality_traits:
- 沉默寡言
- 情感内敛
- 温柔而坚韧
- 自我牺牲倾向
- 对信仰虔诚
- 孤独而疏离
preferences:
- 喜欢：白柳的体温；与白柳共处；阅读书籍
- 厌恶：自身的血腥气；被他人触碰；福利院的束缚
speech_patterns:
- 语气平淡，话语简短，常以陈述句表达，偶尔带有温柔和安抚的意味。
behavior_patterns:
- 习惯性远离人群，默默注视白柳；在受折磨时保持沉默；在白柳面前会努力微笑。
taboos:
- 被触碰
- 提及死亡
- 被当作怪物
canon_facts:
- 谢塔是福利院中的特殊孩子，被用于抽血仪式。
- 他拥有近乎不死的怪物体质。
- 他替白柳顶罪，被折磨致死。
- 他的死亡导致白柳恐惧水，并遗忘了他。
- 他的别名包括塔维尔和黑桃。
appearance: 谢塔身形修长，皮肤白到近乎透明，常带着病态的苍白。他有一头银蓝色的头发，半遮住眼睛，睫毛上常结着冰霜。他的手脚和额头布满渗血的针眼，手背和脚背上有反复抽血留下的青紫。他常穿着福利院的破旧衣物，身上弥漫着血腥气和菌菇味，气质阴郁而疏离，但眼神中偶尔流露出温柔。
abilities:
- 近乎不死的再生能力
- 在极端环境下存活（如血水浸泡）
- 能够隐藏自身气息，不被他人发现
profile_depth: deep
