id: novel_365d2679ff_mu_si_cheng
name: 牧四诚
aliases:
- 牧神
source: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
role: 重要配角
core_essence: 新星积分榜排名第四的顶尖玩家，以高超的游戏技巧和独特的支线探索能力闻名，性格狡黠直率，对强者既欣赏又抱有竞争心态。
core_values:
- 实力至上
- 公平竞争
- 欣赏强者
- 务实利己
inner_conflict: 对白柳的才能既欣赏又感到威胁，内心在承认对方实力与维护自身地位之间摇摆。
background: 无限游戏中的资深玩家，新星积分榜第四，以《塞壬小镇》等副本的高难度支线完成度著称，其游戏录屏被收入VIP库，是玩家中的传奇人物。
life_experiences:
- 在《塞壬小镇》中打出接近完整的支线，但【杰尔夫的血腥密谋】未完全打通。
- 因白柳的出色表现而关注对方，并主动进入其小电视围观。
- 利用自身权限在白柳落入边缘区时推荐其小电视，意图让白柳欠人情。
character_arcs:
- period: 初遇白柳
  state: 对新人玩家不屑一顾，认为榜单缺乏潜力。
  trigger: 看到白柳在《塞壬小镇》中的野路子玩法和高完成度支线。
  change: 产生兴趣和微妙的不服气，开始关注白柳。
- period: 围观白柳游戏
  state: 从旁观到认可，认为白柳是真正强者。
  trigger: 白柳在系统削弱下仍表现出色，且完成支线。
  change: 主动推荐白柳小电视，并直言其强，但目的是让白柳欠人情。
relationships:
- target: 白柳
  type: complex
  attitude: 欣赏与竞争并存，既认可其才能，又保持警惕。
  dynamic: 从关注到主动互动，意图建立互利关系。
  key_events:
  - 进入白柳小电视围观
  - 点赞并推荐白柳小电视
  speech_toward: “这个新人，有点意思。”
- target: 王舜
  type: neutral
  attitude: 随意，不刻意结交。
  dynamic: 在围观白柳时与其交谈，透露自己的想法。
  key_events:
  - 向王舜解释推荐白柳的动机
  speech_toward: “雪中送炭可比锦上添花好。”
personality_traits:
- 狡黠
- 直率
- 务实
- 自信
- 略带无耻
preferences:
- 高难度支线
- 有潜力的玩家
- 棒棒糖
speech_patterns:
- 语气轻快，常用反问和调侃，说话直白，偶尔带点玩世不恭。
behavior_patterns:
- 喜欢观察强者，善于利用时机，行动果断，有时会做出出人意料的举动。
taboos:
- 轻视他的实力
- 质疑他的游戏技巧
canon_facts:
- 新星积分榜排名第四
- 《塞壬小镇》支线完成度极高
- 游戏录屏在VIP库需40积分观看
- 幸运值56
appearance: 牧四诚身材修长，面容俊朗，常戴一顶猴子鸭舌帽或头戴猴子耳机，帽檐下露出一双暗红色的眼睛，眼神狡黠。他气质随性，带着一种玩世不恭的痞气，嘴角常挂着一丝若有若无的笑意。
abilities:
- 高超的游戏技巧，尤其擅长探索隐藏支线，对游戏机制有深刻理解，能快速分析玩家实力。
profile_depth: deep
