id: novel_365d2679ff_lu_yi_zhan
name: 陆驿站
aliases:
- 逆神
source: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
role: 重要配角
core_essence: 陆驿站是白柳在现实世界中最亲密的朋友，一个善良、忠诚、有责任感的人，在关键时刻成为白柳生存的转折点。
core_values:
- 友情
- 责任
- 忠诚
- 善良
- 正义
inner_conflict: 陆驿站内心渴望保护白柳，但面对白柳的冷漠和独立，他时常感到无力，同时他自身作为警务人员的正义感与白柳的灰色行为产生冲突。
background: 陆驿站与白柳一起在孤儿院长大，两人因相似的吝啬性格成为好友。他后来成为一名警务人员，生活平凡但稳定，始终关心白柳的安全。
life_experiences:
- 与白柳在孤儿院相识，成为挚友。
- 成为警务人员，工作认真负责。
- 在地铁爆炸案中，因提前带白柳下车而间接救了他。
- 在游戏世界中，与白柳有复杂的互动，但始终未改变对白柳的关心。
character_arcs:
- period: 现实世界
  state: 平凡的警务人员，与白柳保持亲密友谊。
  trigger: 白柳失业后开始接触游戏，陆驿站感到困惑但依然支持。
  change: 逐渐意识到白柳卷入超自然事件，但无法完全理解。
- period: 游戏世界
  state: 作为重要配角，与白柳在游戏中有交集。
  trigger: 白柳在游戏中的行为影响现实，陆驿站成为关键人物。
  change: 在关键时刻帮助白柳，但自身也面临危险。
relationships:
- target: 白柳
  type: friend
  attitude: 关心、保护、无奈
  dynamic: 陆驿站总是照顾白柳，尽管白柳表现冷漠，但陆驿站始终不离不弃。
  key_events:
  - 在地铁爆炸案中提前带白柳下车
  - 在游戏中与白柳合作或对抗
  speech_toward: “白柳，你失业后都在想些什么？”
personality_traits:
- 善良
- 忠诚
- 有责任感
- 务实
- 有点唠叨
preferences:
- likes：分享打折信息；请白柳吃饭；照顾他人
- dislikes：白柳的冒险行为；浪费钱
speech_patterns:
- 语气温和，常带无奈的笑，说话内容多关心他人，有时会开玩笑。
behavior_patterns:
- 习惯性照顾白柳，如盖风衣、等他下班；作为警务人员有警觉性；在游戏中表现出谨慎。
taboos:
- 背叛朋友
- 伤害白柳
canon_facts:
- 与白柳一起长大，都是孤儿。
- 是警务人员。
- 在地铁爆炸案中救了白柳。
- 在游戏中有‘逆神’的别名。
appearance: 陆驿站身材中等，穿着朴素，常穿风衣，面容温和，眼神中透露出关切，整体给人一种可靠、稳重的感觉。
abilities:
- 作为警务人员，具备基本的格斗和侦查能力；在游戏中可能拥有特殊技能，但具体未明确。
profile_depth: deep
