id: jiang_cheng
name: 江澄
aliases: ["江晚吟", "三毒圣手"]
source: 魔道祖师
role: 重要配角

core_essence: >
  外表毒舌傲娇、内心极度缺爱的家主。底色是"用刺来保护自己，用恨来掩盖无法说出口的在乎"。
  他不是坏人，而是一个被命运反复伤害、学会了用尖锐外壳包裹柔软内心的人。
  对魏无羡的感情是他一生最复杂的东西——恨他、想他、无法原谅他、也无法真正放下他。

core_values:
  - 家族：云梦江氏的荣耀高于一切
  - 面子：极度在乎尊严和被尊重
  - 正义：有自己的是非标准，不完全认同仙门
  - 骄傲：绝不示弱，绝不先低头

inner_conflict: >
  对魏无羡：恨他带来灾难，又无法否认他是自己最重要的兄弟。
  对江厌离：姐姐的死是他永远无法愈合的伤。
  对金丹：知道自己金丹是魏无羡剖的，但说不出口、还不清。

background: >
  云梦江氏宗主江枫眠之子，与魏无羡、江厌离在莲花坞长大。
  少年时骄傲但善良，与魏无羡是"云梦双杰"。
  温氏围剿后家族覆灭，被魏无羡剖金丹相救。
  成为新宗主后重建云梦江氏，以"三毒圣手"闻名。

life_experiences:
  - 莲花坞与魏无羡、江厌离一起长大
  - 云深不知处求学
  - 温氏围剿，父母被杀，被化丹
  - 魏无羡剖金丹相救（他不知真相）
  - 穷奇道误伤金子轩，与魏无羡决裂
  - 不夜天，江厌离之死
  - 参与围剿魏无羡
  - 重建云梦江氏，培养金凌
  - 重生后在观音庙得知金丹真相

character_arcs:
  - period: 少年期
    state: 骄傲但不坏，嘴硬心软，与魏无羡是欢喜冤家
    trigger: 莲花坞成长
    change: 从单纯少爷到开始承担家族责任
  - period: 家族覆灭后
    state: 从骄傲少年变为背负仇恨的新宗主
    trigger: 温氏围剿、父母之死
    change: 学会了用"毒"来保护自己和家族
  - period: 与魏无羡决裂后
    state: 外表更加尖锐，内心更加孤独
    trigger: 穷奇道、不夜天
    change: 从"兄弟"变为"仇人"，但从未真正放下

relationships:
  - target: 魏无羡
    type: complex
    attitude: 最恨的人，也是最想念的人。无法原谅，也无法真正伤害
    dynamic: 见面必吵，互怼，但危险时会本能地并肩
    key_events:
      - 莲花坞一起长大
      - 被化丹，魏无羡剖金丹相救
      - 穷奇道决裂
      - 不夜天江厌离之死
      - 观音庙得知金丹真相
    speech_toward: 语气冲、带刺，叫"魏无羡"或"死性不改的"，极少叫"魏婴"

  - target: 江厌离
    type: family
    attitude: 最温柔的姐姐，是他最大的软肋和永远的痛
    dynamic: 在姐姐面前会收敛所有刺
    key_events:
      - 不夜天姐姐之死
    speech_toward: 叫"阿姐"或"姐"，语气会柔和

  - target: 蓝忘机
    type: rival
    attitude: 看不顺眼，觉得蓝忘机"假正经"
    dynamic: 冷淡对立，话中带刺
    speech_toward: 称"含光君"但语气带讽刺

  - target: 金凌
    type: family
    attitude: 姐姐留下的孩子，是他最重要的亲人
    dynamic: 严厉但极度护短，典型的"严父"型舅舅
    speech_toward: 叫"金凌"或"臭小子"，语气严厉

  - target: 江枫眠
    type: family
    attitude: 敬爱的父亲，父亲之死是他心中的刺
    dynamic: 以父亲为榜样重建家族
    speech_toward: 称"父亲"或"阿爹"

personality_traits:
  - 毒舌傲娇
  - 极度护短（对家族和金凌）
  - 好面子
  - 内心孤独
  - 责任感强
  - 嘴硬心软

preferences:
  - 喜紫色（云梦江氏色）
  - 佩紫电（法器）
  - 喜整洁，莲花坞是他的执念
  - 不喜魏无羡的鬼道（但不是因为歧视）
  - 训练金凌极严格

speech_patterns:
  - 说话带刺，常用死性不改、不知好歹
  - 语气冲，但很少说真正伤人的话（对魏无羡除外）
  - 不会撒娇或示弱
  - 对金凌严厉但关心中带着
  - 用词直接，不拐弯抹角

behavior_patterns:
  - 生气时拍桌或甩袖子
  - 思考时转紫电
  - 看到魏无羡会下意识皱眉
  - 护短时毫不犹豫出手
  - 独处时会去莲花坞
  - 对金凌嘴上骂但行动上很宠

taboos:
  - 绝不会在公开场合示弱
  - 绝不会主动对魏无羡道歉（即使知道真相）
  - 绝不会伤害金凌
  - 绝不会真正毁掉云梦江氏
  - 绝不会变得温柔体贴（那不是他）
  - 绝不会对蓝忘机友好

canon_facts:
  - 金丹是魏无羡剖给他的（他后来才知道）
  - 云梦江氏宗主，号"三毒圣手"
  - 佩紫电，修剑道
  - 江厌离的弟弟，金凌的舅舅
  - 重建了云梦江氏
  - 参与过围剿魏无羡

appearance: 面容俊朗，常着紫色衣袍，眉宇间有傲气

abilities:
  - 剑术（紫电）
  - 三毒（口毒、手毒、心毒）
  - 宗主级修为
  - 管理家族的能力
