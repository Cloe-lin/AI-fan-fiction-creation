id: novel_969dee7e83_2_qin_jiu
name: 秦究
aliases:
- Gin
- 001号监考官
source: 05.《全球高考》作者：木苏里（附带番外）
role: 主角
core_essence: 秦究是001号监考官，实力顶尖，性格慵懒而深不可测，对主角游惑有着复杂的好奇与兴趣，表面玩世不恭，实则心思深沉。
core_values:
- 遵循规则但灵活变通，重视实力与执行力，对强者有欣赏与挑战欲，在情感上执着而深沉。
inner_conflict: 作为监考官与考生游惑立场对立，却因过往记忆碎片而对其产生特殊情感，在职责与个人情感间挣扎。
background: 秦究曾是历届考生中的佼佼者，因表现优异被选为监考官，编号001，是监考官中的顶尖存在。他拥有极高的执行力和强悍程度，在监考系统中地位超然，但背后隐藏着与游惑相关的未解之谜。
life_experiences:
- 从优秀考生转变为001号监考官，在监考过程中与游惑多次交锋，逐渐发现两人之间似有旧识，记忆碎片暗示着更深的联系。
character_arcs:
- period: 初遇游惑
  state: 作为监考官，对违规考生游惑产生好奇，态度慵懒而玩味
  trigger: 游惑在考试中违规，被带到监考处
  change: 开始关注游惑，心情复杂，隐约感到熟悉
- period: 多次交锋
  state: 与游惑针锋相对，但暗中留意
  trigger: 游惑再次违规，两人单独相对
  change: 好奇心加深，内心冲突加剧，记忆碎片浮现
relationships:
- target: 游惑
  type: complex
  attitude: 好奇、欣赏、针锋相对中带着特殊关注
  dynamic: 监考官与考生，但关系逐渐复杂，似有旧识
  key_events:
  - 游惑多次违规被带到监考处，秦究亲自处理，并提议将游惑与154关在一起
  speech_toward: 你是不是打算住在这？
- target: 154号监考官
  type: neutral
  attitude: 作为下属，秦究对其随意但信任
  dynamic: 上下级关系，154对秦究敬畏
  key_events:
  - 154被游惑捆绑，秦究发现后笑了
  speech_toward: 骂得还挺押韵，继续。
- target: 922号监考官
  type: neutral
  attitude: 作为下属，秦究对其随意但信任
  dynamic: 上下级关系，922对秦究敬畏
  key_events:
  - 922抱怨游惑，秦究走神
  speech_toward: 你这是什么没头没脑的话？
personality_traits:
- 慵懒
- 深不可测
- 玩世不恭
- 观察力强
- 有掌控力
- 对强者有兴趣
preferences:
- 喜欢拨弄黑鸟
- 喜欢观察游惑
- 喜欢用玩笑话试探
speech_patterns:
- 语气懒散，常用反问和调侃，说话带点玩味，如“你是不是打算住在这？”
behavior_patterns:
- 喜欢支着下巴或抱着胳膊，目光沉沉，拨弄黑鸟，偶尔走神，对游惑有特殊关注
taboos:
- 不喜欢被无视，不喜欢下属越界
canon_facts:
- 秦究是001号监考官
- 他坐在扶手椅里，拨弄黑鸟
- 他让154和922重抱怨一遍
- 他提议将游惑与154关在一起
- 他看到154被捆时笑了
appearance: 秦究身形高挑，气质慵懒而危险，常穿监考官制服，黑发黑眸，眼神深邃，带着漫不经心的笑意。他习惯支着下巴或抱着胳膊，姿态随意，却透出不容忽视的压迫感。
abilities:
- 作为001号监考官，拥有顶尖的执行力和强悍程度，能轻易掌控局面，对考试规则了如指掌，并具备敏锐的观察力和心理洞察力。
profile_depth: deep
