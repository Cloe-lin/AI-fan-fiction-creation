id: novel_969dee7e83_2_yu_wen
name: 于闻
aliases:
- 小鬼
- 小闻
source: 05.《全球高考》作者：木苏里（附带番外）
role: 重要配角
core_essence: 于闻是一个刚高考完的普通学生，性格跳脱、嘴贫，有点中二，但在关键时刻能保持清醒和幽默感。他依赖表哥游惑，是团队中的气氛调节者。
core_values:
- 家庭亲情、生存本能、对游惑的信任与依赖
inner_conflict: 面对突如其来的死亡考试，于闻内心恐惧但强装镇定，用插科打诨掩饰不安；同时他意识到自己学业荒废，无法依靠知识解题，只能依赖游惑，这种无力感与自尊心产生冲突。
background: 于闻是游惑的表弟，刚参加完高考，正处于疯玩三个月的状态。父亲老于是个酒鬼，家庭关系看似随意实则亲密。游惑因记忆问题常来他家小住，两人关系逐渐亲近。于闻对游惑既崇拜又有点怕。
life_experiences:
- 高考前刚成年，处于自恋巅峰期，觉得普天之下尽傻比，唯一例外是游惑。
- 高中三年周旋于早恋、聚众被殴、翻墙上网和国旗下批斗，公务繁忙，学业荒废。
- 与游惑熟悉起来是近两年的事，游惑每次回国都会来他家小住两天。
- 在雪山小屋考试中，被纹身男叫‘小鬼’，被迫参与讨论，但毫无头绪。
character_arcs:
- period: 考试初期
  state: 茫然、恐惧、嘴硬
  trigger: 进入雪山小屋，面对死亡考试
  change: 从试图用玩笑缓解气氛，到意识到问题的严重性，开始依赖游惑。
- period: 与游惑互动中
  state: 怂、依赖、好奇
  trigger: 游惑醒来并开始行动
  change: 从自我表现转为跟随游惑，学习观察和思考。
relationships:
- target: 游惑
  type: family
  attitude: 崇拜、依赖、有点怕
  dynamic: 于闻视游惑为唯一的例外，认为他厉害但冷漠，相处中既想亲近又不敢造次。
  key_events:
  - 在考试中跟随游惑，被游惑嫌弃‘上给狗了’，但仍信任他。
  speech_toward: 哥，你拿这个干什么？
- target: 老于（父亲）
  type: family
  attitude: 不客气但关心
  dynamic: 父子关系随意，于闻常怼父亲，但关键时刻会维护。
  key_events:
  - 老于在众人面前让于闻表现，于闻翻白眼。
  speech_toward: 你可闭嘴吧。
- target: 纹身男
  type: neutral
  attitude: 反感、不屑
  dynamic: 纹身男轻视于闻，于闻内心骂他傻比，但表面不发作。
  key_events:
  - 纹身男叫他‘小鬼’，质疑他藏私。
  speech_toward: 我干嘛藏着掖着？
- target: 于遥（大肚子女人）
  type: neutral
  attitude: 同情、礼貌
  dynamic: 于遥是陌生人，于闻对她保持基本礼貌。
  key_events:
  - 于遥告诉他游惑的去向。
  speech_toward: 我哥。
personality_traits:
- 嘴贫
- 中二
- 自恋
- 怂但幽默
- 依赖性强
- 观察力尚可
preferences:
- 喜欢吐槽
- 习惯用网络用语
- 对学习不感兴趣
speech_patterns:
- 说话随意，常带脏话和网络梗，如‘我他……’、‘疯球了’、‘傻比’；对游惑说话时语气怂且讨好。
behavior_patterns:
- 遇到危险时先嘴硬，然后看向游惑寻求指示；喜欢碎碎念，用玩笑缓解紧张。
taboos:
- 在游惑面前造次，被游惑嫌弃。
canon_facts:
- 刚高考完，疯玩了三个月。
- 高中三年不务正业。
- 游惑记忆力有问题，常来他家小住。
- 家里长辈有点怕游惑。
appearance: 于闻是个刚成年的少年，身高中等偏瘦，穿着随意，可能带着学生气。他面容清秀，但常带着玩世不恭的表情，眼神灵动，透着一股机灵劲儿。气质上有点痞，但面对游惑时会显得怂。
abilities:
- 虽然学业荒废，但善于观察和吐槽，能在紧张环境中调节气氛；对考试技巧有一定了解，但物理知识匮乏。
profile_depth: deep
