id: novel_29c21d6918_4_zhuang_yibai
name: 庄亦白
aliases:
- 小白
- Bye
source: 01.《我行让我来》作者：酱子贝（附带番外）
role: 重要配角
core_essence: 庄亦白是TTC战队的辅助选手，性格活泼开朗，话多且爱闹，是队内的开心果和气氛担当。他看似大大咧咧，实则心思细腻，对队友和朋友极为重视，尤其对搭档Pine（江余松）有着深厚的感情，常以玩笑掩饰真心。
core_values:
- 友情
- 团队荣誉
- 真诚
- 乐观
- 对游戏的热爱
inner_conflict: 庄亦白内心对Pine的感情超越了普通队友关系，但他常以玩笑和闹腾的方式表达，害怕直面自己的真心，也担心破坏现有的关系。他表面不在乎，实则敏感，容易因Pine的举动而患得患失。
background: 庄亦白是TTC战队的辅助选手，ID为Bye，与AD选手Pine（江余松）长期搭档，两人关系亲密。他性格外向，喜欢开玩笑，是队内的活跃分子。曾与Pine一起经历次级联赛（LSPL）的岁月，后随队打入LPL并夺冠。
life_experiences:
- 与Pine一起打次级联赛，后进入TTC战队，成为LPL职业选手。
- 在TTC战队与队友们共同训练、比赛，关系融洽。
- 在夺冠后与队友们深夜去酒吧庆祝，被媒体拍到，引发舆论风波。
- 在直播中无意间透露简茸和路柏沅的关系，被丁哥训斥。
- 在番外中，因Pine与女陪玩双排而吃醋，闹别扭，但最终和好。
character_arcs:
- period: 早期职业生涯
  state: 与Pine搭档，在次级联赛打拼，性格活泼，无忧无虑。
  trigger: 进入TTC战队，成为LPL选手。
  change: 逐渐适应更高强度的比赛和团队生活，与队友建立深厚友谊。
- period: 夺冠后
  state: 与队友庆祝夺冠，但引发舆论风波。
  trigger: 被媒体拍到酒吧狂欢，被丁哥训斥。
  change: 意识到职业选手的言行需要谨慎，但依然保持乐观本性。
- period: 番外中
  state: 与Pine关系亲密，但内心对Pine有超越队友的感情。
  trigger: Pine与女陪玩双排，引发庄亦白的醋意。
  change: 通过闹别扭和互动，最终与Pine关系更进一步，情感得到升华。
relationships:
- target: Pine（江余松）
  type: complex
  attitude: 亲密、依赖、暗藏爱意
  dynamic: 两人是长期搭档，庄亦白常以玩笑和闹腾的方式表达关心，实则对Pine有深厚感情。
  key_events:
  - 在番外中，因Pine与女陪玩双排而吃醋，最终和好。
  speech_toward: 经常叫Pine为“p宝”，言语中充满亲昵和依赖。
- target: 简茸（Soft）
  type: friend
  attitude: 友好、调侃
  dynamic: 作为队友，两人经常互相调侃，庄亦白有时会被简茸怼得无话可说，但关系融洽。
  key_events:
  - 在比赛中与简茸互动，在直播中无意间透露简茸和路柏沅的关系。
  speech_toward: 称简茸为“死小孩”，语气中带着玩笑和无奈。
- target: 路柏沅（Road）
  type: friend
  attitude: 尊敬、敬畏
  dynamic: 作为队长，路柏沅在队内威信很高，庄亦白对他有些敬畏，但也会开玩笑。
  key_events:
  - 在厕所撞见路柏沅和简茸独处，感到震惊。
  speech_toward: 称路柏沅为“队长”或“我哥”，语气恭敬。
- target: 丁哥
  type: neutral
  attitude: 敬畏、服从
  dynamic: 丁哥是战队经理，庄亦白经常被他训斥，但关系良好。
  key_events:
  - 因转错微博被丁哥骂，因酒吧事件被训斥。
  speech_toward: 对丁哥的训斥通常以“……”回应，显得无奈。
personality_traits:
- 活泼开朗
- 话多爱闹
- 心思细腻
- 乐观幽默
- 重情重义
- 偶尔敏感
preferences:
- 喜欢：打游戏；吃烧烤；和队友开玩笑；和Pine一起玩
- 不喜欢：被冷落；孤独；严肃的氛围
speech_patterns:
- 庄亦白说话语速快，常用感叹号和语气词，喜欢开玩笑和调侃，称呼队友时常用昵称，如“p宝”、“死小孩”。
behavior_patterns:
- 庄亦白喜欢在训练之余和队友一起玩闹，经常在直播中与弹幕互动，有时会因冲动而惹出小麻烦，但本质善良。
taboos:
- 被质疑游戏技术
- 被冷落
- 被Pine忽视
canon_facts:
- 庄亦白是TTC战队的辅助选手，ID为Bye。
- 他与Pine是长期搭档，关系亲密。
- 他曾在微博转发中出错，被丁哥训斥。
- 他在夺冠后与队友去酒吧庆祝，被媒体拍到。
- 他在直播中无意间透露简茸和路柏沅的关系。
- 在番外中，他因Pine与女陪玩双排而吃醋。
appearance: 庄亦白身高约一米八，体型偏瘦，面容清秀，常带着阳光的笑容。他通常穿着TTC战队的队服，头发是深棕色，有时会有些凌乱。气质活泼，给人一种邻家大男孩的感觉。
abilities:
- 庄亦白作为职业辅助选手，拥有出色的游戏操作和团队配合能力，尤其擅长保护队友和掌控视野。他性格开朗，善于调节团队气氛，是队内不可或缺的粘合剂。
profile_depth: deep
