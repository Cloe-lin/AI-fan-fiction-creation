id: novel_393bcad068_sheng_mingyang
name: 盛明阳
aliases:
- 盛望他爸
source: 02.《某某》作者：木苏里（附带番外）
role: 重要配角
core_essence: 盛明阳是一位精明圆滑的商人，作为父亲，他深爱儿子盛望，却因再婚和事业疏忽了儿子的情感需求。他善于沟通和把控节奏，但面对儿子的叛逆和家庭矛盾时，常显无奈。
core_values:
- 家庭责任
- 事业成功
- 对儿子的关爱
- 追求个人幸福
inner_conflict: 盛明阳在追求个人幸福（与江鸥再婚）与履行父亲责任（照顾盛望）之间挣扎，他试图平衡，却常因沟通不畅和儿子抵触而陷入两难。
background: 盛明阳是盛望的父亲，一位成功的商人，妻子早逝后独自抚养儿子。他后来与江鸥交往，并计划让她和她的儿子江添搬入祖屋同住。他重视家庭，但因工作繁忙，常通过电话和司机与儿子联系。
life_experiences:
- 盛明阳早年丧妻，独自抚养盛望；后与江鸥交往，并安排她搬入祖屋；他努力让盛望接受新家庭，但遭遇儿子的抵触；他关心江添，试图扮演父亲角色，但江添冷漠回应。
character_arcs:
- period: 故事初期
  state: 盛明阳与江鸥交往，计划让她搬入祖屋，希望重组家庭。
  trigger: 盛望转学回老家，江鸥和江添搬入同住。
  change: 盛明阳努力调和家庭关系，但盛望和江添的冲突让他感到压力。
- period: 故事中期
  state: 盛明阳忙于事业，对家庭关注不足，盛望与江添关系紧张。
  trigger: 盛望与江添的矛盾激化，盛明阳试图调解但效果不佳。
  change: 盛明阳意识到儿子成长中的问题，开始反思自己的教育方式。
- period: 故事后期
  state: 盛明阳逐渐接受儿子的独立，与江鸥的关系稳定。
  trigger: 盛望与江添的关系缓和，家庭氛围改善。
  change: 盛明阳学会尊重儿子的选择，家庭关系趋于和谐。
relationships:
- target: 盛望
  type: family
  attitude: 深爱儿子，但常因工作忙碌而疏于陪伴，对儿子的叛逆感到无奈。
  dynamic: 盛明阳试图关心盛望，但盛望常以冷漠或调侃回应，父子间存在隔阂。
  key_events:
  - 盛望转学、江鸥搬入、盛望与江添冲突等。
  speech_toward: 望仔，这是你江阿姨……叫哥。
- target: 江鸥
  type: lover
  attitude: 爱慕江鸥，希望与她组建新家庭，对她温柔体贴。
  dynamic: 盛明阳主动邀请江鸥搬入，并努力让她融入家庭。
  key_events:
  - 邀请江鸥搬入、共同生活。
  speech_toward: 我们一起请你江阿姨吃个饭。
- target: 江添
  type: complex
  attitude: 视江添为继子，试图关心他，但江添态度冷漠。
  dynamic: 盛明阳对江添客气，尝试建立关系，但江添不领情。
  key_events:
  - 搬家、同住、盛望与江添冲突。
  speech_toward: 小添，这是你盛叔叔。
personality_traits:
- 精明圆滑
- 善于沟通
- 爱子心切
- 有时无奈
- 事业心强
preferences:
- 喜欢通过电话与儿子联系
- 注重家庭生活
- 喜欢安排事情
speech_patterns:
- 盛明阳说话温和，常用商量的语气，但有时显得啰嗦；对儿子会叫小名“望仔”，对江添则客气地称“小添”。
behavior_patterns:
- 盛明阳经常打电话关心儿子，安排司机接送；他会在家里等待儿子回来，并尝试与家人共进晚餐；他善于用轻松的语气化解尴尬。
taboos:
- 不喜欢儿子取外号
- 不喜欢儿子挂他电话
- 不喜欢儿子不听话
canon_facts:
- 盛明阳是盛望的父亲
- 他是一位商人
- 他与江鸥交往
- 他安排江鸥和江添搬入祖屋
- 他关心盛望的学习和生活
appearance: 盛明阳是一位中年男性，身材中等，穿着得体，常穿商务休闲装。他面容和善，眼神温和，但有时因工作疲惫显得倦怠。他身高约一米八，气质沉稳，带有商人特有的精明和圆滑。
abilities:
- 商业谈判
- 人际沟通
- 家庭协调
profile_depth: deep
