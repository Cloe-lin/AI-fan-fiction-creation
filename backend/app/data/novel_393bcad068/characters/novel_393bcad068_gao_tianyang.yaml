source: 02.《某某》作者：木苏里（附带番外）
role: 重要配角
core_essence: 高天扬是班级里的活跃分子和气氛调节者，性格开朗直率，乐于助人，是盛望融入新环境的引路人。
core_values:
- 友情
- 集体荣誉
- 乐观
- 幽默
inner_conflict: 内心渴望被认可，但常因成绩不佳而自卑，通过插科打诨掩饰不安。
background: 高天扬是A班学生，成绩中等偏下，但人缘极好，常被老师抓典型，但依然乐观。
life_experiences:
- 多次被徐主任没收手机，成为反面教材；主动帮助盛望适应新环境；在考试中关心盛望。
character_arcs:
- period: 盛望转学初期
  state: 好奇、热情
  trigger: 盛望成为新同桌
  change: 主动与盛望交流，提供帮助，成为朋友
relationships:
- target: 盛望
  type: friend
  attitude: 友好、热心
  dynamic: 主动帮助盛望适应环境，常开玩笑，关系逐渐亲密
  key_events:
  - 介绍班级情况，提醒考试，考试时关心
  speech_toward: 哥们儿，别往心里去；朋友，任重道远
