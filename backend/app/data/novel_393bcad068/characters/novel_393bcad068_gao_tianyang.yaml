  speech_toward: 醒醒嘿添哥，自习了
- target: 徐主任
  type: neutral
  attitude: 无奈、调侃
  dynamic: 常被徐主任抓典型，私下称其为大嘴
  key_events:
  - 手机被没收，被扣分
  speech_toward: 等毕业了，找人打徐大嘴一顿
