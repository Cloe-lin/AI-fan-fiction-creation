  default_after_ending: true
  ending_summary: 庄凡心与顾拙言在经历抄袭诬陷、抑郁症等重重磨难后，终于沉冤得雪，江回被判刑，程嘉玛获释。庄凡心决定重拾珠宝设计梦想，并入股silhouette。两人在洛杉矶正式注册结婚，在礼堂中交换誓言，从此幸福相守。
  ending_state:
  - 庄凡心与顾拙言在洛杉矶正式结婚，互相戴上婚戒，承诺一生相伴。
  - 庄凡心决定重返校园完成珠宝设计学业，并成为silhouette的股东。
  - 江回因侵犯知识产权和诽谤罪被判三年有期徒刑，事业尽毁。
  - 程嘉玛因罪责较轻被释放，但名声受损。
  - 庄凡心与顾拙言获得双方家庭认可，两家人团聚庆祝。
  - 庄凡心克服抑郁，重拾信心，与顾拙言开始新生活。
  visibility: private
