  default_after_ending: true
  ending_summary: 在番外结局中，庄亦白与Pine确认了恋爱关系，Pine放弃转会留在TTC，两人在基地公开了恋情。TTC战队成员关系更加紧密，丁哥因队员接连恋爱而调侃辞职，故事在轻松幽默的氛围中收束。
  ending_state:
  - 庄亦白与Pine正式确立恋爱关系，Pine留在TTC，两人继续作为下路搭档。
  - 简茸与路柏沅恋情稳定，路柏沅复诊后归队。
  - 袁谦计划求婚，战队氛围融洽。
  - 丁哥因队员恋爱事件调侃要辞职，但实际仍继续担任经理。
  - TTC战队全员续约，备战德玛西亚杯。
  visibility: public
