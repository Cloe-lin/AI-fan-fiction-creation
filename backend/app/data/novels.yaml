- id: novel_e5a7519d37
  title: 《逆袭》作者：柴鸡蛋
  collection: novel_e5a7519d37
  text_subdir: novel_e5a7519d37/text
  source_file: novel_e5a7519d37.txt
  novel_source: ''
  source_encoding: utf-8
  default_after_ending: true
  ending_summary: 故事在众人的欢聚与温情中落幕。吴所畏与池骋历经波折后感情更加深厚，吴所畏事业有成，两人在朋友们的见证下甜蜜互动，最终以一首《稳稳的幸福》和额头一吻定格幸福。其他几对情侣也各有归宿，汪朕与汪顾虽未明说，但关系微妙。番外以感谢宴和欢歌热舞收尾，众人各得其所，生活归于平静而温馨。
  ending_state:
  - 吴所畏与池骋感情稳固，吴所畏事业成功，两人甜蜜互动，吴所畏终于实现‘攻下总攻’的愿望。
  - 姜小帅与郭城宇关系亲密，日常打闹，生活和谐。
  - 汪朕与汪顾关系暧昧，汪顾依赖汪朕，汪朕对汪顾有柔情。
  - 岳悦未在结尾出现，但此前已与吴所畏和解，各自安好。
  - 众人齐聚庆祝，友情与爱情双丰收，故事在温馨氛围中结束。
  visibility: public
  owner_id: ''
- id: novel_393bcad068
  title: 02.《某某》作者：木苏里（附带番外）
  collection: novel_393bcad068
  text_subdir: novel_393bcad068/text
  source_file: novel_393bcad068.txt
  novel_source: ''
  source_encoding: utf-8
  default_after_ending: true
  ending_summary: 故事在多年后的异国与日常中收束。盛望与江添历经分离与重逢，最终定居北京，与少年时代的朋友们保持着亲密联系。他们共同经历了搬家、旅行、朋友结婚等生活片段，江添逐渐将照顾盛望变成日常习惯，而盛望也重新找回了少年时的活泼与骄矜。结尾以丁老头的老房子和夏天的蝉鸣作结，暗示时间流逝但情谊长存，他们来日方长。
  ending_state:
  - 盛望与江添正式定居北京，生活稳定，感情深厚。
  - 盛望与江添与高天扬、徐小嘴等旧友保持往来，友情长存。
  - 盛望与江添与家人（盛明阳、江鸥、丁老头）关系和睦，时常探望。
  - 盛望与江添各自事业有成，生活步入正轨。
  - 盛望与江添的恋情修成正果，戒指内圈刻有‘太阳，和一生的爱人’，象征永恒。
  visibility: public
  owner_id: ''
- id: novel_969dee7e83
  title: 05.《全球高考》作者：木苏里（附带番外）
  collection: novel_969dee7e83
  text_subdir: novel_969dee7e83/text
  source_file: novel_969dee7e83.txt
  novel_source: ''
  source_encoding: utf-8
  default_after_ending: true
  ending_summary: 在猎人小屋里，众人围炉夜话，等待可能归来的154。窗外风雪中，一个清瘦人影推门而入，正是154，他抖落伞上的雪，说‘抱歉，我来晚了’。故事在此收束，所有重要人物重聚，暗示着新的开始与圆满。
  ending_state:
  - 游惑与秦究在猎人小屋中重聚，关系亲密，共同等待154。
  - 154在风雪中归来，与众人重逢。
  - 楚月、922、高齐等人在小屋中团聚，氛围温暖。
  - 系统残留问题得到解决，众人生活回归平静。
  - 游惑与秦究的感情稳定，彼此信任。
  visibility: private
  owner_id: ''
- id: novel_7733cf2a3a
  title: 06.《小蘑菇》作者：一十四洲（附带番外）
  collection: novel_7733cf2a3a
  text_subdir: novel_7733cf2a3a/text
  source_file: novel_7733cf2a3a.txt
  novel_source: ''
  source_encoding: utf-8
  default_after_ending: true
  ending_summary: 在深渊的第四次旅程中，安折与陆沨的关系更加亲密，两人在装甲车内温馨互动，安折撒娇抱怨陆沨的“凶”，陆沨则温柔回应。与此同时，哈伯德在战斗中英勇牺牲，唐岚为救他而坠落悬崖，两人在朝阳中相拥，展现了英雄主义的光辉。最终，安折与陆沨在回忆与亲吻中确认了彼此的爱意，故事在温馨与感伤中收束。
  ending_state:
  - 安折与陆沨感情稳定，彼此深爱，日常互动温馨甜蜜。
  - 哈伯德在战斗中牺牲，唐岚为救他而坠落，两人生死相依。
  - 纪博士仍在研究所工作，与陆沨保持损友关系。
  - 波利·琼、哈伯德、唐岚等角色各有归宿，世界逐渐恢复和平。
  visibility: private
  owner_id: 261b853dcd29439c89f48bf627ef6270
