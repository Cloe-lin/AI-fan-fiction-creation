- id: novel_365d2679ff
  title: 18.《我在无限游戏里封神》作者：壶鱼辣椒（附带番外）
  collection: novel_365d2679ff
  text_subdir: novel_365d2679ff/text
  source_file: novel_365d2679ff.txt
  novel_source: ''
  source_encoding: utf-8
  default_after_ending: true
  ending_summary: 白柳在成为新邪神后，选择重置所有世界线，抹除自身存在，以灵魂封住欲望之门，换取世界线的和平与众人幸福。十年后，世界线融合，白柳以人类身份归来，与谢塔重逢，并逐渐与记忆恢复的旧友们重聚，最终在冬夜的热闹与温暖中迎来圆满结局。
  ending_state:
  - 白柳：以人类身份回归，与谢塔重逢，与旧友重聚，开始新生活。
  - 谢塔：等待十年后与白柳重逢，拥有体温和心跳，与白柳共同生活。
  - 陆驿站：保留记忆，与方点共同守护世界线，等待白柳归来。
  - 刘佳仪：恢复部分记忆，与白柳重逢，要求白柳买红豆饼。
  - 木柯：恢复部分记忆，与白柳重逢，指责白柳不告而别。
  - 牧四诚：恢复部分记忆，与白柳重逢，激动落泪并责骂白柳。
  visibility: private
  owner_id: user02
- id: novel_f09f2031be
  title: 32.《别来无恙》作者：北南（附带番外）
  collection: novel_f09f2031be
  text_subdir: novel_f09f2031be/text
  source_file: novel_f09f2031be.txt
  novel_source: ''
