id: novel_7733cf2a3a_an_zhe
name: 安折
aliases:
- 小蘑菇
source: 06.《小蘑菇》作者：一十四洲（附带番外）
role: 主角
core_essence: 一只拥有自我意识的蘑菇，为了寻找丢失的孢子而进入人类基地，在末世中逐渐理解人类情感与牺牲，成为连接人类与异类的桥梁。
core_values:
- 寻找孢子
- 生存
- 理解与共情
- 牺牲与责任
inner_conflict: 作为非人类生物，安折在寻找孢子的过程中逐渐产生对人类情感和道德的理解，但自身蘑菇的本能与人类社会的规则不断冲突，他既渴望融入人类世界，又无法完全摆脱异类的身份。
background: 安折原本是深渊中的一朵蘑菇，因意外获得人类基因而拥有了人类形态和意识。他唯一的孢子丢失后，为了找回孢子，他决定前往人类基地，途中遇到濒死的人类安泽，获得其衣物和ID卡，并继承了安泽的遗愿。
life_experiences:
- 在深渊中作为蘑菇生存，获得人类基因后化为人形。
- 遇到濒死的人类安泽，安泽给予他衣物、ID卡和地图，并警告他人类基地的危险。
- 安泽死后，安折穿上安泽的衣物，带着弹壳和地图，踏上前往北方基地的旅程。
- 在旅途中，安折逐渐适应人类形态，并利用蘑菇的特性在危险环境中生存。
character_arcs:
- period: 初始
  state: 作为蘑菇，失去孢子，感到空虚和恐慌。
  trigger: 遇到安泽，获得人类身份和地图。
  change: 决定前往人类基地寻找孢子，开始模仿人类行为。
- period: 旅途中
  state: 在荒野中艰难前行，逐渐适应人类形态。
  trigger: 目睹各种变异生物和危险环境。
  change: 更加坚定寻找孢子的决心，同时开始思考人类与异类的区别。
relationships:
- target: 安泽
  type: friend
  attitude: 感激与怀念
  dynamic: 安泽是第一个与安折交流的人类，给予他帮助和警告，安折对安泽的死感到遗憾。
  key_events:
  - 安泽在临死前将ID卡和地图交给安折，并警告他人类基地的危险。
  speech_toward: 安折曾喃喃念出安泽的名字，并回忆他的话语。
- target: 陆沨
  type: complex
  attitude: 未知
  dynamic: 陆沨是人类军方上校，安折为了找回孢子而接近他，但两人关系尚未展开。
  key_events:
  - 安折敲开陆沨的家门，请求归还孢子。
  speech_toward: 安折对陆沨说：“先生，您好。您手下那项研究进行得好吗？研究完可不可以把我的儿子还给我？”
personality_traits:
- 温和
- 单纯
- 执着
- 好奇
- 适应力强
preferences:
- 喜欢潮湿阴暗的环境
- 对人类的语言和文化感到好奇
speech_patterns:
- 说话缓慢，有时会停顿
- 使用简单的词汇，偶尔会模仿人类的语气词如“嘤”
behavior_patterns:
- 在危险面前保持静止
- 利用菌丝感知环境
- 模仿人类的行为和穿着
taboos:
- 避免被人类发现非人类身份
- 不能暴露自己蘑菇的本质
canon_facts:
- 安折是朵蘑菇，毕生使命是养出孢子。
- 他丢失了唯一的孢子。
- 他获得了人类安泽的基因，从而学会了人类语言和形态。
- 他决定前往人类基地寻找孢子。
- 他携带一枚黄铜色弹壳，认为它与孢子丢失有关。
appearance: 安折化为人形后，拥有雪白的脚踝和细腻的皮肤，穿着安泽留下的染血灰白色长袖衬衫、黑色硬质背带裤和黑色皮靴。他身形纤细，动作略显笨拙，气质温和而略带茫然，仿佛对周围的一切都感到陌生。
abilities:
- 拥有蘑菇的再生和感知能力
- 能通过菌丝吸收基因信息
- 在危险环境中不易被注意
- 适应力强，能模仿人类行为
profile_depth: deep
