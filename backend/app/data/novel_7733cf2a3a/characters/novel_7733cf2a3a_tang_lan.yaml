id: novel_7733cf2a3a_tang_lan
name: 唐岚
aliases: []
source: 06.《小蘑菇》作者：一十四洲（附带番外）
role: 重要配角
core_essence: 一个在深渊中因感染而异变、失去人类身份但保留人类意识与情感的前佣兵队副队长，他选择留在深渊为其他异变者指路，并加入融合派高地研究所，成为新成员的引导者。
core_values:
- 忠诚、牺牲、希望、对同伴的牵挂、对生命的尊重。
inner_conflict: 他因感染而异变，失去了人类身份，无法回到过去的生活，但内心仍保留着对哈伯德和旧日同伴的深厚情感；他既庆幸自己保留了意识，又因异变带来的痛苦和不确定性而挣扎。
background: 唐岚曾是外城最传奇的佣兵队队长哈伯德的副队，两人有过命交情。在一次深渊探险中，他与哈伯德发生争执，当晚独自守夜时遭遇强大怪物，为示警并引开怪物而牺牲，死后却因感染异变而苏醒，成为拥有强大能力但非人的存在。
life_experiences:
- 深渊探险中为救队友牺牲，异变后苏醒；在深渊中游荡，为其他异变者留下路标；加入融合派高地研究所，成为波利·琼的追随者；遇到安折，带他加入研究所。
character_arcs:
- period: 佣兵时期
  state: 作为哈伯德的副队，忠诚勇敢，与哈伯德关系深厚。
  trigger: 与哈伯德在探险中发生争执，当晚独自守夜。
  change: 遭遇怪物，为救队友牺牲，异变后失去人类身份。
- period: 异变后
  state: 在深渊中游荡，保留人类意识，但身体异变。
  trigger: 遇到安折，带他前往高地研究所。
  change: 加入融合派，成为研究所成员，接受新身份。
relationships:
- target: 哈伯德
  type: friend
  attitude: 深厚情谊，牵挂与愧疚
  dynamic: 曾是过命交情的战友，因争执后牺牲，异变后不敢回去面对。
  key_events:
  - 与哈伯德争执后牺牲；异变后向安折询问哈伯德近况，得知他安好后释然。
  speech_toward: 他……他还好吗？……那就好。
- target: 安折
  type: complex
  attitude: 友善、引导
  dynamic: 在深渊中相遇，带他加入高地研究所，成为其引导者。
  key_events:
  - 为安折指路，带他飞往高地研究所，介绍融合派。
  speech_toward: 路标在我这里，还没放下。……我带新成员回来了。
- target: 波利·琼
  type: mentor
  attitude: 尊敬、忠诚
  dynamic: 波利·琼是融合派科学家，唐岚追随他，加入研究所。
  key_events:
  - 带安折见波利·琼，称其为“先生”。
  speech_toward: 先生，我带新成员回来了。
personality_traits:
- 散漫不羁
- 忠诚重情
- 勇敢牺牲
- 冷静果断
- 友善温和
preferences:
- 喜欢用匕首在树干上刻路标；喜欢帮助其他异变者。
speech_patterns:
- 说话带笑，语气散漫；关键时刻简洁利落；对波利·琼恭敬。
behavior_patterns:
- 在深渊中留下路标；异变后仍保持人类习惯；带新成员时主动引导。
taboos:
- 不愿提及哈伯德的具体情况；不愿回到人类基地。
canon_facts:
- 曾是哈伯德佣兵队的副队
- 在深渊中为救队友牺牲
- 异变后拥有黑色翼翅，能飞行
- 加入融合派高地研究所
- 为其他异变者留下路标
appearance: 身材高挑修长，五官俊美，黑发。平时穿着普通衣物，异变时背后会展开巨大的黑色薄膜翼翅，收回时身体颤抖、面露痛苦。气质散漫不羁，眼神有时会闪现非人的漆黑。
abilities:
- 异变后拥有强大的力量和飞行能力，能展开黑色翼翅高速飞行；身体可能具有超常的恢复力或战斗力；能感知危险。
profile_depth: deep
