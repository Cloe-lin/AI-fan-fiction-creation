id: novel_7733cf2a3a_lu_feng
name: 陆沨
aliases:
- 上校
source: 06.《小蘑菇》作者：一十四洲（附带番外）
role: 主角
core_essence: 陆沨是末世背景下人类基地的审判者，以冷酷无情著称，坚信人类至上，对异种和感染者毫不留情，但内心深处隐藏着对真相的执着和对人类未来的责任感。
core_values:
- 人类至上
- 秩序与规则
- 责任与牺牲
- 真相与判断
inner_conflict: 陆沨作为审判者，必须冷酷地执行审判，但面对安折时，他逐渐产生动摇，怀疑自己的判断，并在人类与异种之间挣扎，最终在真相面前重新定义自己的信念。
background: 陆沨是末世后人类基地的审判者，负责鉴别和清除感染体与异种。他拥有极高的权限和冷酷的执行力，深受基地信任，但内心孤独，对人性有着深刻的洞察和怀疑。
life_experiences:
- 在审判庭工作多年，执行过无数次审判，亲手处决过无数疑似感染体。
- 第一次遇到安折时，直觉他不是人类，但基因检查无异常，因此放过了他。
- 在巡防中多次与安折相遇，逐渐注意到他的异常行为，但始终没有找到决定性证据。
- 在范斯事件中，他亲自揭开白布，确认范斯的感染，展现了冷酷的一面。
- 随着与安折的接触加深，他开始质疑自己的判断，并最终卷入更大的真相。
character_arcs:
- period: 初期
  state: 冷酷无情的审判者，坚信人类至上，对异种零容忍。
  trigger: 遇到安折，直觉他不是人类，但基因检查无异常。
  change: 开始对安折产生兴趣，但依然保持警惕。
- period: 中期
  state: 在巡防中多次与安折相遇，逐渐注意到他的异常，但依然执行审判职责。
  trigger: 范斯事件中，他冷酷地确认感染，但安折的哀伤让他有所触动。
  change: 内心开始动摇，对审判的绝对性产生怀疑。
- period: 后期
  state: 在真相面前，重新定义自己的信念，与安折的关系发生转变。
  trigger: 发现安折的真实身份，以及人类与异种之间的复杂关系。
  change: 从冷酷的审判者转变为寻求真相和希望的守护者。
relationships:
- target: 安折
  type: complex
  attitude: 从怀疑到逐渐信任，最终产生深厚情感。
  dynamic: 从审判者与被审判者的关系，逐渐转变为相互理解与依赖。
  key_events:
  - 初次见面时直觉他不是人类，但基因检查无异常
  - 多次巡防中相遇，逐渐注意到他的异常
  - 在范斯事件中，安折的哀伤让他有所触动
  - 最终发现安折的真实身份，并选择保护他
  speech_toward: 你最好是。
- target: 波利·琼
  type: neutral
  attitude: 专业合作，保持距离。
  dynamic: 作为同事，共同执行审判任务。
  key_events:
  - 在审判庭中合作处理案件
  speech_toward: 请您配合，博士。
personality_traits:
- 冷酷
- 果断
- 理性
- 孤独
- 有责任感
- 洞察力强
preferences:
- 喜欢用子弹解决问题
- 不喜欢废话
- 对细节敏感
speech_patterns:
- 语言简洁冰冷
- 常用命令式语气
- 很少表达情感
behavior_patterns:
- 执行审判时毫不犹豫
- 对可疑对象进行严密观察
- 在带新人时严格但生硬
taboos:
- 不容忍感染体
- 不容忍隐瞒真相
- 不容忍背叛人类
canon_facts:
- 是审判庭的上校
- 第一次申请基因检查是为了安折
- 在范斯事件中亲手确认感染
- 最终与安折关系复杂
appearance: 陆沨是一位年轻男性，身材削拔，轮廓鲜明，黑发垂在额前，压住斜飞的眉尾，眉梢眼角被冷光镀上一层淡薄的冷色。他有一双冰凉的绿色眼睛，目光冷漠，像刀子一样刮人。他常穿黑色制服，佩戴枪支，气质冷峻，给人一种不可接近的压迫感。
abilities:
- 高超的枪法
- 敏锐的观察力
- 强大的判断力
- 审判庭的权威
profile_depth: deep
