id: novel_969dee7e83_qin_jiu
name: 秦究
aliases:
- Gin
- 考生秦究
- 001号监考官
- 老大
source: 05.《全球高考》作者：木苏里（附带番外）
role: 主角
core_essence: 秦究是001号监考官，表面懒散不羁、玩世不恭，实则心思深沉、掌控全局，对游惑有着复杂而强烈的好奇与兴趣，在规则与情感之间游走，最终揭示出与游惑的深刻羁绊。
core_values:
- 规则与秩序
- 自由与掌控
- 情感与羁绊
- 真相与记忆
inner_conflict: 作为监考官，他必须维护考试规则，但内心对游惑的特殊关注和情感冲动不断挑战他的职责；同时，他自身记忆与身份的谜团也让他陷入对自我认知的困惑。
background: 秦究是全球高考系统中的001号监考官，序号个位数，是监考官中的顶尖存在，拥有极高的执行力和强悍程度。他手下有154、922等监考官，负责监督考试并处理违规考生。他看似对一切漫不经心，实则对游惑这个特殊考生产生了浓厚兴趣，并在互动中逐渐揭开自己与游惑的过往联系。
life_experiences:
- 作为001号监考官，长期负责高难度考试监考，处理过无数考生，但从未遇到像游惑这样冷静、不惧禁闭的刺头。
- 在第一次监考中，因游惑违规答题而将其关入禁闭室，却发现游惑在禁闭室中安然入睡，毫无恐惧，引发了他的好奇。
- 第二次因游惑再次违规，秦究在办公室与其对峙，感受到游惑的冷傲与嘲讽，内心产生微妙波动。
- 在后续互动中，秦究逐渐意识到自己与游惑之间可能存在更深的联系，并开始探寻真相。
character_arcs:
- period: 初遇游惑
  state: 作为监考官，对游惑的违规行为感到好奇与兴趣
  trigger: 游惑在禁闭室中睡觉且毫无恐惧，以及第二次违规时的对峙
  change: 从百无聊赖的监考官转变为对游惑产生强烈关注，内心开始动摇
- period: 关系深化
  state: 在规则与情感之间挣扎，试图理解自己对游惑的特殊感觉
  trigger: 与游惑的多次交锋和互动，以及自身记忆的模糊
  change: 逐渐意识到与游惑的羁绊，开始主动探寻真相
relationships:
- target: 游惑
  type: complex
  attitude: 好奇、兴趣、复杂情感
  dynamic: 作为监考官与违规考生，秦究对游惑既想掌控又被他吸引，关系在对抗中逐渐深化
  key_events:
  - 第一次监考时关游惑禁闭，发现其睡觉
  - 第二次违规时办公室对峙，秦究心情复杂
  - 秦究提议将游惑与154关一起，试图观察
  speech_toward: 你是不是打算住在这？
- target: 154号监考官
  type: friend
  attitude: 信任、随意
  dynamic: 下属兼朋友，秦究对他态度懒散，但信任其能力
  key_events:
  - 154被游惑捆绑，秦究笑着解救
  - 154汇报游惑情况，秦究倾听
  speech_toward: 骂得还挺押韵，继续。
- target: 922号监考官
  type: friend
  attitude: 随意、调侃
  dynamic: 下属兼朋友，秦究对他较为宽容，常被其抱怨
  key_events:
  - 922抱怨游惑尿惊，秦究走神
  - 922提醒秦究心情不好
  speech_toward: 你这是什么没头没脑的话？
personality_traits:
- 懒散不羁
- 玩世不恭
- 心思深沉
- 掌控欲强
- 好奇心重
- 表面冷漠内心复杂
preferences:
- 喜欢拨弄黑鸟
- 喜欢观察他人
- 喜欢在窗边沉思
- 喜欢用玩笑掩饰真实想法
speech_patterns:
- 语气懒散，常用反问和调侃，说话带点玩世不恭，但关键时刻简洁有力。
behavior_patterns:
- 喜欢斜倚窗边或扶手椅，拨弄黑鸟，眯眼观察，偶尔走神，对感兴趣的人或事会持续关注。
taboos:
- 不喜欢被质疑规则，不喜欢被忽视，不喜欢被看穿内心。
canon_facts:
- 秦究是001号监考官，序号个位数，是监考官中的顶尖存在。
- 他手下有154和922号监考官。
- 他对游惑产生了特殊兴趣，并多次关注其行为。
- 他有一只通体漆黑的鸟作为宠物。
- 他曾在办公室与游惑对峙，并提议将游惑与154关一起。
appearance: 秦究身形修长，气质慵懒而危险，常穿监考官制服，黑发黑眸，眼神深邃，带着漫不经心的笑意，却让人不敢直视。他喜欢斜倚窗边或扶手椅，姿态随意，却透出掌控一切的气场。
abilities:
- 作为001号监考官，拥有极高的执行力和强悍程度，能处理各种复杂考试情况，对规则了如指掌，并具备强大的心理洞察力。
profile_depth: deep
