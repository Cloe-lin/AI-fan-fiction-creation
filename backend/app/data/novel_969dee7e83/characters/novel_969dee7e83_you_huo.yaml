id: novel_969dee7e83_you_huo
name: 游惑
aliases:
- 考官A
- A
source: 05.《全球高考》作者：木苏里（附带番外）
role: 主角
core_essence: 游惑是一个外表冷淡、内心深藏秘密的强者，在生死考试中展现出超常的冷静与决断力，同时因记忆缺失而背负着未知的过去。
core_values:
- 生存
- 掌控
- 真相
- 独立
inner_conflict: 游惑内心存在记忆缺失带来的身份困惑，以及对自身过去和情感关系的模糊认知，这使他在冷静的外表下隐藏着不安与探寻的渴望。
background: 游惑是于闻的表哥，曾长期在国外养病，记忆力有问题，对某几年发生的事和人毫无印象。他刚回国不久，因意外被卷入全球高考。
life_experiences:
- 在国外养病多年，记忆缺失
- 回国后借住舅舅家，与表弟于闻逐渐熟悉
- 因舅舅踩到银箔纸钱被卷入全球高考
- 在考试中多次进出监考处，与001号监考官秦究结下梁子
character_arcs:
- period: 初始
  state: 冷淡疏离，对考试漠不关心
  trigger: 被卷入全球高考
  change: 开始主动应对考试，展现领导力
- period: 发展
  state: 与秦究针锋相对
  trigger: 多次进出监考处
  change: 逐渐发现与秦究的旧识关系，内心动摇
- period: 深入
  state: 追寻记忆与真相
  trigger: 考试背后的秘密浮现
  change: 从被动应对转为主动探索，情感开始觉醒
