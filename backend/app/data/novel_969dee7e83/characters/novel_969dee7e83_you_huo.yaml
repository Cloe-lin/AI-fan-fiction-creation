appearance: 游惑是一个二十七八岁的青年，个子很高，模样极为出挑，扶着上门框低头进屋时，与身后的山松白雪浑然成景。他皮肤白，眸子清透的浅棕色，眼皮很薄，不带表情时有种薄情寡义的距离感。右耳戴着一枚耳钉，映着灯光雪色亮得晃眼。他常穿长裤，气质冷淡倨傲。
abilities:
- 冷静分析
- 快速决策
- 领导力
- 物理知识（暗示）
- 对考试规则敏锐
