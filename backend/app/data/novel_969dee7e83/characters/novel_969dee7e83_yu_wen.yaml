id: novel_969dee7e83_yu_wen
name: 于闻
aliases: []
source: 05.《全球高考》作者：木苏里（附带番外）
role: 重要配角
core_essence: 一个刚高考完、正处于自恋巅峰期的普通少年，在生死攸关的全球高考中逐渐成长，从依赖表哥游惑到学会独立面对危机。
core_values:
- 家庭亲情、生存本能、对表哥的信任与崇拜
inner_conflict: 一方面想依赖表哥游惑，另一方面又渴望证明自己；面对死亡威胁时，既恐惧又不得不坚强。
background: 于闻是游惑的表弟，刚参加完高考，正处于疯玩三个月的状态。他家庭关系复杂，父亲老于酗酒，但对他关心。于闻与游惑熟悉起来是近两年的事，游惑因记忆问题常来他家小住。于闻对游惑既崇拜又有些畏惧。
life_experiences:
- 高考后与父亲、表哥游惑一同被卷入全球高考，在雪山小屋中经历第一场物理考试，因缺乏知识而依赖游惑，但也在过程中逐渐适应。
character_arcs:
- period: 初入考场
  state: 茫然、恐惧、依赖
  trigger: 被卷入全球高考，面对雪山小屋的死亡威胁
  change: 从不知所措到尝试寻找线索，开始依赖表哥游惑
- period: 考试过程中
  state: 逐渐适应、尝试独立
  trigger: 游惑的引导和自身生存欲望
  change: 学会观察环境、思考问题，不再完全依赖他人
relationships:
- target: 游惑
  type: family
  attitude: 崇拜、依赖、略带畏惧
  dynamic: 游惑是于闻的表哥，于闻对他既崇拜又有些害怕，关键时刻总是依赖他。
  key_events:
  - 在雪山小屋中，于闻跟随游惑寻找线索，被游惑训斥‘上给狗了’，但仍信任他。
  speech_toward: 哥，你拿这个干什么？
- target: 老于（父亲）
  type: family
  attitude: 不客气但内心关心
  dynamic: 于闻对父亲老于态度随意，甚至呵斥，但关键时刻仍会听从。
  key_events:
  - 老于在众人面前夸他会考试，于闻让他‘闭嘴’。
  speech_toward: 你可闭嘴吧。
- target: 纹身男
  type: complex
  attitude: 反感、轻蔑
  dynamic: 纹身男轻视于闻，于闻对他暗中竖起中指，但不敢正面冲突。
  key_events:
  - 纹身男质疑于闻藏私，于闻无声地伸中指。
  speech_toward: 傻比。
personality_traits:
- 自恋、中二、幽默、有点怂但关键时刻不掉链子、对亲人关心但嘴上不饶人
preferences:
- 喜欢吐槽、玩梗、看小说电影
speech_patterns:
- 口语化、爱用网络流行语、脏话较多（如‘我他’、‘傻比’）、喜欢翻白眼
behavior_patterns:
- 习惯性依赖游惑，但也会尝试自己思考；面对危险时先吐槽再行动
taboos:
- 被轻视、被质疑能力
canon_facts:
- 刚高考完，疯玩了三个月；高中三年周旋于早恋、聚众被殴、翻墙上网和国旗下批斗；对物理一窍不通，只会蒙题技巧；与游惑是表兄弟关系。
appearance: 于闻是个刚成年的少年，身材中等，穿着随意，带着学生气。他面容青涩，眼神中带着几分玩世不恭，常翻白眼，表情丰富。气质上带着中二少年的自恋和痞气，但面对危险时又显得怂而真实。
abilities:
- 擅长吐槽和活跃气氛，对考试蒙题技巧有一定了解，但实际知识储备不足；在危机中能快速适应，并尝试观察环境寻找线索。
profile_depth: deep
