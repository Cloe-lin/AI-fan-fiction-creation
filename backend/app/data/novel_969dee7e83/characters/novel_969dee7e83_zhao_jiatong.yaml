id: novel_969dee7e83_zhao_jiatong
name: 赵嘉彤
aliases: []
source: 05.《全球高考》作者：木苏里（附带番外）
role: 重要配角
core_essence: 赵嘉彤是一位性格温和、干练理性的监考官，因犯错被罚参加考试，在混乱中保持冷静，是同伴高齐的稳定器。
core_values:
- 秩序
- 责任
- 理性
- 忠诚
inner_conflict: 作为监考官，她因犯错被罚，内心对系统规则有复杂态度，同时面对旧识秦究和游惑时，既保持职业距离又难掩旧日情感。
background: 赵嘉彤是早期监考官之一，编号0（后改口称赵嘉彤），与高齐搭档。因犯错被系统罚入考试，与高齐一同成为考生。她性格温和，与秦究虽有隔阂但不形于色，对游惑（考官A）有旧识之情。
life_experiences:
- 作为早期监考官，曾参与系统运作，与游惑、秦究等有过交集。
- 因犯错被罚参加考试，与高齐一同进入考场。
- 在马车中认出游惑，震惊于其未死且回归。
- 在卡尔顿庄园外，与高齐一同面对秦究，保持冷静克制。
character_arcs:
- period: 早期监考官时期
  state: 作为编号0的监考官，与游惑、秦究等共事，经历系统早期对抗。
  trigger: 系统BUG或内部冲突导致游惑被除名、秦究修养。
  change: 逐渐从核心抽离，成为末位号监考官，对系统产生复杂态度。
- period: 被罚考试时期
  state: 与高齐一同被罚进入考试，作为考生参与。
  trigger: 犯错被罚，进入考场。
  change: 在考试中偶遇游惑和秦究，面对旧日恩怨，保持理性与温和。
relationships:
- target: 高齐
  type: friend
  attitude: 搭档与朋友，常劝诫高齐，但理解其情绪。
  dynamic: 两人同为监考官，被罚考试时相互扶持。
  key_events:
  - 在马车中一同认出游惑，在庄园外一起面对秦究。
  speech_toward: “你能不能有一天醒着？嗯？”
- target: 游惑（考官A）
  type: complex
  attitude: 旧识，震惊于其回归，态度复杂。
  dynamic: 曾为同事，游惑被除名后失联，重逢时情绪激动。
  key_events:
  - 在马车中认出游惑，酒壶掉落，喃喃自语“考官A……我的天，是你么？”
  speech_toward: “考官A……我的天，是你么？”
- target: 秦究（001）
  type: complex
  attitude: 有隔阂但表面温和，内心保持距离。
  dynamic: 早期监考官，因系统事件有隔阂，但赵嘉彤不形于色。
  key_events:
  - 在庄园外与秦究相遇，保持礼貌但紧绷。
  speech_toward: “你干嘛，见鬼了？”（对高齐说）
- target: 周祺
  type: neutral
  attitude: 友善，对考生保持礼貌。
  dynamic: 在马车中与周祺初次见面，自我介绍。
  key_events:
  - 自我介绍时差点说出编号0，改口为赵嘉彤。
  speech_toward: “抱歉啊，被塞过来考试心情不好。刚刚吓着你了？我是0——我叫赵嘉彤。”
personality_traits:
- 温和
- 干练
- 理性
- 克制
- 忠诚
preferences:
- likes：秩序；清醒；稳定
- dislikes：混乱；酗酒；冲动
speech_patterns:
- 说话简洁干练，语气温和但有时无奈，常用短句。
behavior_patterns:
- 在混乱中保持冷静，常劝诫高齐，面对旧识时克制情绪。
taboos:
- 不喜高齐过度酗酒
- 不愿提及早期监考官内部冲突
canon_facts:
- 赵嘉彤是监考官，编号0（后改口）。
- 因犯错被罚参加考试。
- 与高齐搭档。
- 认识游惑（考官A）和秦究（001）。
- 性格温和，与秦究有隔阂但不形于色。
appearance: 赵嘉彤看上去三十多岁，剪着短发，显得很干练。她穿着监考官服装，气质沉稳，眼神锐利，但表情温和。身高中等，体态匀称，常以冷静的姿态出现在人群中。
abilities:
- 作为监考官，具备系统操作和考场管理能力，观察力敏锐，能在混乱中保持理性。
profile_depth: deep
